<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Smartphone mid-frame sealing-groove feature map</title>
  <desc id="desc">An engineering data diagram showing the sealing path, corners, mating plane, mounting holes, and global form of a smartphone mid-frame.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#236c78"/>
      <stop offset=".5" stop-color="#36b89f"/>
      <stop offset="1" stop-color="#d7c65e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dceff2"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#071820"/>
  <g opacity=".12" stroke="#85bec7">
    <path d="M0 90H1280M0 180H1280M0 270H1280M0 360H1280M0 450H1280M0 540H1280M0 630H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>
  <text x="64" y="70" fill="#f2fbfc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Mid-Frame Sealing-Groove Feature Map</text>
  <text x="64" y="106" fill="#97bcc4" font-family="Arial, sans-serif" font-size="18">A continuous sealing path is evaluated together with its mating plane and assembly references</text>

  <g filter="url(#shadow)">
    <rect x="304" y="152" width="438" height="442" rx="62" fill="url(#frame)" stroke="#c1f1e9" stroke-width="4"/>
    <rect x="338" y="188" width="370" height="370" rx="42" fill="#0b2934" stroke="#87e2d1" stroke-width="3"/>
    <rect x="366" y="216" width="314" height="314" rx="30" fill="#102f39" stroke="#f3cd61" stroke-width="10"/>
    <path d="M402 254H644V492H402Z" fill="#0a222b" stroke="#38717b" stroke-width="2" stroke-dasharray="8 9"/>
    <circle cx="358" cy="214" r="14" fill="#071820" stroke="#f2966d" stroke-width="4"/>
    <circle cx="688" cy="214" r="14" fill="#071820" stroke="#f2966d" stroke-width="4"/>
    <circle cx="358" cy="536" r="14" fill="#071820" stroke="#f2966d" stroke-width="4"/>
    <circle cx="688" cy="536" r="14" fill="#071820" stroke="#f2966d" stroke-width="4"/>
    <rect x="478" y="166" width="90" height="16" rx="8" fill="#66d7de"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g fill="none" stroke="#dceff2" stroke-width="2" marker-end="url(#arrow)">
      <path d="M1008 172H770L681 224"/>
      <path d="M1028 278H764L686 350"/>
      <path d="M1016 398H766L698 522"/>
      <path d="M1018 520H776L735 558"/>
      <path d="M190 202H290L342 214"/>
      <path d="M180 344H298L366 344"/>
      <path d="M178 502H290L322 522"/>
    </g>
    <g fill="#f4fbfc" font-size="19" font-weight="700">
      <text x="1020" y="167">Corner continuity</text>
      <text x="1040" y="273">Groove path location</text>
      <text x="1028" y="393">Mating-plane relationship</text>
      <text x="1030" y="515">Global frame form</text>
      <text x="64" y="197">Mounting reference</text>
      <text x="64" y="339">Groove width / depth</text>
      <text x="64" y="497">Edge and transition</text>
    </g>
    <g fill="#9ebfc6" font-size="15">
      <text x="1020" y="192">section continuity around turns</text>
      <text x="1040" y="298">position relative to datums</text>
      <text x="1028" y="418">flatness, profile, local height</text>
      <text x="1030" y="540">warpage and twist pattern</text>
      <text x="64" y="222">hole, locator, datum structure</text>
      <text x="64" y="364">local section and profile</text>
      <text x="64" y="522">wall, fillet, nearby surface</text>
    </g>
  </g>

  <rect x="64" y="632" width="1152" height="50" rx="7" fill="#0d2731" stroke="#355b65"/>
  <g font-family="Arial, sans-serif" font-size="16">
    <circle cx="100" cy="657" r="9" fill="#f3cd61"/><text x="118" y="663" fill="#cfe3e7">sealing path</text>
    <circle cx="292" cy="657" r="9" fill="#36b89f"/><text x="310" y="663" fill="#cfe3e7">mating plane</text>
    <circle cx="488" cy="657" r="9" fill="#f2966d"/><text x="506" y="663" fill="#cfe3e7">assembly reference</text>
    <circle cx="720" cy="657" r="9" fill="#66d7de"/><text x="738" y="663" fill="#cfe3e7">orientation feature</text>
    <text x="1006" y="663" fill="#91b7bf">Illustrative map</text>
  </g>
</svg>
