<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Smartphone sealing quality evidence loop</title>
  <desc id="desc">A closed-loop workflow separating geometric evidence, assembly-process evidence, and functional sealing evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/>
      <stop offset="1" stop-color="#143440"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#77d9dc"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="66" y="70" fill="#f3fbfc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Smartphone Sealing Quality Evidence Loop</text>
  <text x="66" y="106" fill="#99bec5" font-family="Arial, sans-serif" font-size="18">Geometry is necessary evidence, but final sealing performance requires process and functional validation</text>

  <g stroke="#77d9dc" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M304 244H418"/>
    <path d="M626 244H740"/>
    <path d="M948 244C1054 244 1080 316 1080 360"/>
    <path d="M1050 486H936"/>
    <path d="M728 486H614"/>
    <path d="M406 486H292"/>
    <path d="M174 444C128 420 128 316 174 280"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g>
      <rect x="96" y="180" width="208" height="128" rx="8" fill="#0d2a34" stroke="#2ac7d7" stroke-width="2"/>
      <text x="124" y="220" fill="#ecfbfd" font-size="22" font-weight="700">Design Intent</text>
      <text x="124" y="254" fill="#add0d6" font-size="16">CAD, datums, groove rules</text>
      <text x="124" y="282" fill="#72e1e9" font-size="14" font-weight="700">REQUIREMENT</text>
    </g>
    <g>
      <rect x="418" y="180" width="208" height="128" rx="8" fill="#0d2a34" stroke="#67d5ad" stroke-width="2"/>
      <text x="446" y="220" fill="#ecfbfd" font-size="22" font-weight="700">3D Geometry</text>
      <text x="446" y="254" fill="#add0d6" font-size="16">path, section, plane, form</text>
      <text x="446" y="282" fill="#84e8bb" font-size="14" font-weight="700">GEOMETRIC EVIDENCE</text>
    </g>
    <g>
      <rect x="740" y="180" width="208" height="128" rx="8" fill="#0d2a34" stroke="#f1c85f" stroke-width="2"/>
      <text x="768" y="220" fill="#ecfbfd" font-size="22" font-weight="700">Seal / Adhesive</text>
      <text x="768" y="254" fill="#add0d6" font-size="16">material, path, dispensing</text>
      <text x="768" y="282" fill="#f4d67d" font-size="14" font-weight="700">PROCESS EVIDENCE</text>
    </g>
    <g>
      <rect x="842" y="422" width="208" height="128" rx="8" fill="#0d2a34" stroke="#e6926d" stroke-width="2"/>
      <text x="870" y="462" fill="#ecfbfd" font-size="22" font-weight="700">Assembly State</text>
      <text x="870" y="496" fill="#add0d6" font-size="16">compression, fit, fastening</text>
      <text x="870" y="524" fill="#f0aa89" font-size="14" font-weight="700">ASSEMBLY EVIDENCE</text>
    </g>
    <g>
      <rect x="520" y="422" width="208" height="128" rx="8" fill="#0d2a34" stroke="#b89ae5" stroke-width="2"/>
      <text x="548" y="462" fill="#ecfbfd" font-size="22" font-weight="700">Functional Test</text>
      <text x="548" y="496" fill="#add0d6" font-size="16">leak, environment, durability</text>
      <text x="548" y="524" fill="#ceb8ef" font-size="14" font-weight="700">FUNCTIONAL EVIDENCE</text>
    </g>
    <g>
      <rect x="198" y="422" width="208" height="128" rx="8" fill="#0d2a34" stroke="#68bddb" stroke-width="2"/>
      <text x="226" y="462" fill="#ecfbfd" font-size="22" font-weight="700">Controlled Change</text>
      <text x="226" y="496" fill="#add0d6" font-size="16">design, tool, process, method</text>
      <text x="226" y="524" fill="#82cee7" font-size="14" font-weight="700">CONFIRMED FEEDBACK</text>
    </g>
  </g>

  <rect x="66" y="620" width="1148" height="62" rx="8" fill="#0d2731" stroke="#355e68"/>
  <text x="96" y="646" fill="#f0f8f9" font-family="Arial, sans-serif" font-size="17" font-weight="700">Decision rule:</text>
  <text x="96" y="670" fill="#abcbd1" font-family="Arial, sans-serif" font-size="16">A conforming groove reduces geometric risk; it does not, by itself, certify waterproof performance.</text>
</svg>
