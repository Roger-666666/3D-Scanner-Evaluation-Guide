<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">文创手办工业IP授权衍生品供应链验收闭环</title>
  <desc id="desc">展示权利边界、数字母版、衍生设计、供应商制造、样件几何复核和授权放行之间的闭环关系。</desc>
  <rect width="1200" height="720" fill="#f4f6f7"/>
  <rect x="40" y="40" width="1120" height="640" rx="8" fill="#ffffff" stroke="#c8d1d8" stroke-width="2"/>
  <text x="80" y="95" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#172631">从授权母版到交付样件：供应链验收闭环</text>
  <text x="80" y="128" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#586671">A controlled loop for licensed derivatives and multi-supplier delivery</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#566773"/>
    </marker>
  </defs>
  <g fill="none" stroke="#566773" stroke-width="3" marker-end="url(#arrow2)">
    <path d="M270 240 L410 240"/>
    <path d="M600 240 L740 240"/>
    <path d="M835 295 L835 420"/>
    <path d="M740 475 L600 475"/>
    <path d="M410 475 L270 475"/>
    <path d="M175 420 L175 295"/>
  </g>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g transform="translate(80 185)">
      <rect width="190" height="110" rx="6" fill="#eadff0" stroke="#80608f" stroke-width="2"/>
      <text x="95" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#493453">权利与对象边界</text>
      <text x="95" y="68" text-anchor="middle" font-size="15" fill="#624c6b">授权范围 / 原作状态</text>
      <text x="95" y="92" text-anchor="middle" font-size="13" fill="#624c6b">RIGHTS</text>
    </g>
    <g transform="translate(410 185)">
      <rect width="190" height="110" rx="6" fill="#d9edf3" stroke="#277b9b" stroke-width="2"/>
      <text x="95" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#183c4b">受控数字母版</text>
      <text x="95" y="68" text-anchor="middle" font-size="15" fill="#355866">实测 / 修复 / 版本</text>
      <text x="95" y="92" text-anchor="middle" font-size="13" fill="#355866">GEOMETRY</text>
    </g>
    <g transform="translate(740 185)">
      <rect width="190" height="110" rx="6" fill="#e2eacb" stroke="#6e8a38" stroke-width="2"/>
      <text x="95" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#35451d">授权衍生设计</text>
      <text x="95" y="68" text-anchor="middle" font-size="15" fill="#53672d">比例 / 材质 / 拆件</text>
      <text x="95" y="92" text-anchor="middle" font-size="13" fill="#53672d">DESIGN</text>
    </g>
    <g transform="translate(740 420)">
      <rect width="190" height="110" rx="6" fill="#f0e6c7" stroke="#a57b27" stroke-width="2"/>
      <text x="95" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#5b4518">供应商制造</text>
      <text x="95" y="68" text-anchor="middle" font-size="15" fill="#735c2c">工艺 / 模具 / 批次</text>
      <text x="95" y="92" text-anchor="middle" font-size="13" fill="#735c2c">PROCESS</text>
    </g>
    <g transform="translate(410 420)">
      <rect width="190" height="110" rx="6" fill="#d9edf3" stroke="#277b9b" stroke-width="2"/>
      <text x="95" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#183c4b">样件几何复核</text>
      <text x="95" y="68" text-anchor="middle" font-size="15" fill="#355866">身份特征 / 接口 / 细节</text>
      <text x="95" y="92" text-anchor="middle" font-size="13" fill="#355866">EVIDENCE</text>
    </g>
    <g transform="translate(80 420)">
      <rect width="190" height="110" rx="6" fill="#e7e9ec" stroke="#6f7d87" stroke-width="2"/>
      <text x="95" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#34434d">授权放行</text>
      <text x="95" y="68" text-anchor="middle" font-size="15" fill="#53616b">结论 / 例外 / 适用范围</text>
      <text x="95" y="92" text-anchor="middle" font-size="13" fill="#53616b">APPROVAL</text>
    </g>
  </g>

  <rect x="360" y="330" width="380" height="65" rx="6" fill="#f3f6f7" stroke="#c6d0d6"/>
  <text x="550" y="357" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2c3d48">统一资产编号 + 版本 + 供应商 + 样件身份</text>
  <text x="550" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#62707a">Shared asset, revision, supplier and sample identity</text>

  <rect x="985" y="205" width="135" height="245" rx="6" fill="#f7f9fa" stroke="#cbd4d9"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#475761">
    <text x="1004" y="236" font-weight="700">放行不是：</text>
    <text x="1004" y="266">只看渲染图</text>
    <text x="1004" y="292">只看整体拟合</text>
    <text x="1004" y="318">只验一个样件</text>
    <line x1="1004" y1="338" x2="1100" y2="338" stroke="#c6d0d6"/>
    <text x="1004" y="368" font-weight="700">放行需要：</text>
    <text x="1004" y="394">权限清晰</text>
    <text x="1004" y="420">版本一致</text>
    <text x="1004" y="446">证据可复查</text>
  </g>
  <text x="80" y="662" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#6c7982">流程示意，不代表具体授权合同或验收规范 / Conceptual workflow, not a licensing agreement or acceptance specification</text>
</svg>
