    <text x="82" y="208" font-weight="700">可靠采集区</text>
    <text x="82" y="234" fill="#5c6b75">可见几何与细节</text>

    <path d="M455 183 L775 183 L845 205" fill="none" stroke="#314653" stroke-width="2"/>
