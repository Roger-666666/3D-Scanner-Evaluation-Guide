    <path d="M132 350 C142 336,158 328,170 328 C182 328,198 336,208 350 L218 415 L122 415 Z" fill="#d98664" stroke="#314653" stroke-width="3"/>
    <rect x="140" y="172" width="60" height="48" rx="12" fill="#78a9ce" stroke="#314653" stroke-width="3"/>
    <g fill="#ffffff" opacity="0.82">
      <circle cx="149" cy="80" r="8"/><circle cx="191" cy="80" r="8"/>
