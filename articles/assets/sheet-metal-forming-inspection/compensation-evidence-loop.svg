<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sheet-metal compensation evidence loop</title><desc id="desc">A gated evidence loop from process state and scanning to pattern diagnosis, simulation review, controlled correction and rescan.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536879"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#163044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#587080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.ln{stroke:#536879;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/>
  <text x="78" y="96" class="t h">成形补偿证据闭环：扫描结果不能直接变成模具修正量</text><text x="78" y="130" class="t s">A gated loop from controlled geometry evidence to approved process correction</text>
  <g class="t"><rect x="90" y="215" width="180" height="100" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="180" y="249" text-anchor="middle" class="k">状态定义</text><text x="180" y="274" text-anchor="middle" class="e">材料、方向、自由/夹持</text><text x="180" y="295" text-anchor="middle" class="e">State definition</text>
  <rect x="315" y="215" width="180" height="100" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="405" y="249" text-anchor="middle" class="k">受控扫描</text><text x="405" y="274" text-anchor="middle" class="e">覆盖、对齐、截面族</text><text x="405" y="295" text-anchor="middle" class="e">Controlled capture</text>
  <rect x="540" y="215" width="180" height="100" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="630" y="249" text-anchor="middle" class="k">模式诊断</text><text x="630" y="274" text-anchor="middle" class="e">整体、扭转、局部、边界</text><text x="630" y="295" text-anchor="middle" class="e">Pattern diagnosis</text>
  <rect x="765" y="215" width="180" height="100" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="855" y="249" text-anchor="middle" class="k">工艺评审</text><text x="855" y="274" text-anchor="middle" class="e">仿真、模具、材料、压机</text><text x="855" y="295" text-anchor="middle" class="e">Process review</text>
  <rect x="765" y="405" width="180" height="100" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="855" y="439" text-anchor="middle" class="k">受控修正</text><text x="855" y="464" text-anchor="middle" class="e">审批版本与目标区域</text><text x="855" y="485" text-anchor="middle" class="e">Controlled correction</text>
  <rect x="540" y="405" width="180" height="100" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="630" y="439" text-anchor="middle" class="k">复扫桥接</text><text x="630" y="464" text-anchor="middle" class="e">目标区与非目标区复核</text><text x="630" y="485" text-anchor="middle" class="e">Rescan bridge</text>
  <rect x="315" y="405" width="180" height="100" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="405" y="439" text-anchor="middle" class="k">装配验证</text><text x="405" y="464" text-anchor="middle" class="e">间隙、孔群、接口关系</text><text x="405" y="485" text-anchor="middle" class="e">Assembly validation</text></g>
  <path d="M270 265H305M495 265H530M720 265H755M855 315V395M765 455H730M540 455H505" class="ln"/><path d="M405 405V355H180V325" class="ln"/>
  <rect x="115" y="555" width="970" height="40" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="581" text-anchor="middle" class="t e">任何修正都需要独立工艺评审与复验；扫描仅提供几何证据 / Corrections require independent process review and verification</text>
</svg>

