<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sheet-metal batch and tooling drift matrix</title><desc id="desc">Conceptual matrix classifying common-mode, die-local, batch-state and measurement-state geometry changes.</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.c{stroke:#b8c5ce;stroke-width:1.5}</style></defs>
  <rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/>
  <text x="78" y="96" class="t h">跨批次几何漂移矩阵：先辨别模式，再决定是否动模具</text><text x="78" y="130" class="t s">Classify geometry drift across batches, tools and measurement states before intervention</text>
  <g transform="translate(80 185)" class="t"><text x="0" y="-18" class="k">功能区 × 时间线 / Functional zone by timeline</text><rect x="0" y="0" width="170" height="55" fill="#edf1f3" class="c"/><text x="85" y="34" text-anchor="middle" class="b">功能区域</text><g class="b"><rect x="170" y="0" width="120" height="55" fill="#edf1f3" class="c"/><text x="230" y="34" text-anchor="middle">基线</text><rect x="290" y="0" width="120" height="55" fill="#edf1f3" class="c"/><text x="350" y="34" text-anchor="middle">批次 A</text><rect x="410" y="0" width="120" height="55" fill="#edf1f3" class="c"/><text x="470" y="34" text-anchor="middle">批次 B</text><rect x="530" y="0" width="120" height="55" fill="#edf1f3" class="c"/><text x="590" y="34" text-anchor="middle">维护后</text></g>
  <g class="b"><rect x="0" y="55" width="170" height="62" fill="#fbfcfd" class="c"/><text x="85" y="92" text-anchor="middle">主曲面</text><rect x="0" y="117" width="170" height="62" fill="#fbfcfd" class="c"/><text x="85" y="154" text-anchor="middle">孔群</text><rect x="0" y="179" width="170" height="62" fill="#fbfcfd" class="c"/><text x="85" y="216" text-anchor="middle">翻边</text><rect x="0" y="241" width="170" height="62" fill="#fbfcfd" class="c"/><text x="85" y="278" text-anchor="middle">切边线</text></g>
  <g class="c"><rect x="170" y="55" width="120" height="62" fill="#dceacb"/><rect x="290" y="55" width="120" height="62" fill="#f6e8bc"/><rect x="410" y="55" width="120" height="62" fill="#f6e8bc"/><rect x="530" y="55" width="120" height="62" fill="#dceacb"/><rect x="170" y="117" width="120" height="62" fill="#dceacb"/><rect x="290" y="117" width="120" height="62" fill="#dceacb"/><rect x="410" y="117" width="120" height="62" fill="#f2d8d6"/><rect x="530" y="117" width="120" height="62" fill="#f2d8d6"/><rect x="170" y="179" width="120" height="62" fill="#dceacb"/><rect x="290" y="179" width="120" height="62" fill="#e7dfee"/><rect x="410" y="179" width="120" height="62" fill="#e7dfee"/><rect x="530" y="179" width="120" height="62" fill="#dceacb"/><rect x="170" y="241" width="120" height="62" fill="#dceacb"/><rect x="290" y="241" width="120" height="62" fill="#d8edf7"/><rect x="410" y="241" width="120" height="62" fill="#dceacb"/><rect x="530" y="241" width="120" height="62" fill="#d8edf7"/></g></g>
  <g class="t"><rect x="790" y="185" width="310" height="64" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="812" y="213" class="k">共同模式</text><text x="812" y="235" class="e">材料、工艺、工装、版本</text><rect x="790" y="265" width="310" height="64" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="812" y="293" class="k">局部持续模式</text><text x="812" y="315" class="e">模具镶件、冲头、局部磨损</text><rect x="790" y="345" width="310" height="64" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="812" y="373" class="k">批次同步模式</text><text x="812" y="395" class="e">板料、润滑、压机与支撑状态</text><rect x="790" y="425" width="310" height="64" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="812" y="453" class="k">数据质量模式</text><text x="812" y="475" class="e">覆盖、边缘、对齐、模板变更</text></g>
  <rect x="115" y="555" width="970" height="42" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="582" text-anchor="middle" class="t e">矩阵颜色仅用于模式分类，不表示统计能力、公差或实测结果 / Conceptual pattern classes only</text>
</svg>

