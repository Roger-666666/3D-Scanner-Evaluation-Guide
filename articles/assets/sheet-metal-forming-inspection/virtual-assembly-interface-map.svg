<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sheet-metal virtual assembly interface map</title><desc id="desc">Conceptual virtual assembly map for hole alignment, gap, interference, flushness and contact zones.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526878"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.ln{stroke:#526878;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/>
  <text x="78" y="96" class="t h">虚拟装配接口图：把“装不上”拆成可复核的空间关系</text><text x="78" y="130" class="t s">Virtual assembly separates hole alignment, gap, interference, flushness and contact</text>
  <g transform="translate(75 185)"><path d="M40 95H380V225H265V315H40Z" fill="#d8edf7" stroke="#4f8daf" stroke-width="4"/><path d="M205 155H520V350H350V270H205Z" fill="#f6e8bc" stroke="#b58a25" stroke-width="4" opacity=".9"/><circle cx="120" cy="160" r="25" fill="#fff" stroke="#2e8b72" stroke-width="6"/><circle cx="284" cy="220" r="25" fill="#fff" stroke="#d05f4f" stroke-width="6"/><circle cx="450" cy="240" r="25" fill="#fff" stroke="#2e8b72" stroke-width="6"/><path d="M275 210L295 230M295 210L275 230" stroke="#d05f4f" stroke-width="4"/><path d="M360 90V155" stroke="#8b70a7" stroke-width="5"/><path d="M350 105H370" stroke="#8b70a7" stroke-width="5"/><text x="280" y="395" text-anchor="middle" class="t e">概念叠合视图 / Conceptual overlay</text></g>
  <path d="M620 350H675" class="ln"/><g class="t"><rect x="700" y="178" width="390" height="65" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="724" y="207" class="k">孔轴匹配 / Hole alignment</text><text x="724" y="229" class="e">孔中心、孔轴、孔群与基准</text><rect x="700" y="258" width="390" height="65" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="724" y="287" class="k">间隙分布 / Gap</text><text x="724" y="309" class="e">沿功能边界连续评价，不只取单点</text><rect x="700" y="338" width="390" height="65" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="724" y="367" class="k">干涉区域 / Interference</text><text x="724" y="389" class="e">区分实体重叠、数据缺口与姿态错误</text><rect x="700" y="418" width="390" height="65" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="724" y="447" class="k">面差与接触 / Flushness</text><text x="724" y="469" class="e">结合夹持顺序、接触区与功能方向</text></g>
  <rect x="115" y="555" width="970" height="42" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="582" text-anchor="middle" class="t e">虚拟装配用于定位证据，不替代真实载荷、连接工艺与整机试装 / Virtual assembly does not replace physical joining validation</text>
</svg>

