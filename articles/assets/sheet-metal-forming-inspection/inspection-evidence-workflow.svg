<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sheet-metal inspection evidence workflow</title><desc id="desc">A traceable workflow connecting inspection question, state, data quality, functional alignment, result, review and decision.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526878"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:17px;font-weight:700}.e{font-size:13px;fill:#506979}.ln{stroke:#526878;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/>
  <text x="78" y="96" class="t h">可追溯钣金检测证据链：报告不是最后一张截图</text><text x="78" y="130" class="t s">A traceable chain from inspection intent to approved decision</text>
  <g class="t"><rect x="80" y="215" width="150" height="110" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="155" y="250" text-anchor="middle" class="k">检测问题</text><text x="155" y="276" text-anchor="middle" class="e">尺寸、曲面、孔位</text><text x="155" y="298" text-anchor="middle" class="e">装配或过程</text><rect x="265" y="215" width="150" height="110" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="340" y="250" text-anchor="middle" class="k">对象与状态</text><text x="340" y="276" text-anchor="middle" class="e">零件、批次、方向</text><text x="340" y="298" text-anchor="middle" class="e">自由/夹持</text><rect x="450" y="215" width="150" height="110" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="525" y="250" text-anchor="middle" class="k">数据质量</text><text x="525" y="276" text-anchor="middle" class="e">覆盖、边界、复扫</text><text x="525" y="298" text-anchor="middle" class="e">不可评价区</text><rect x="635" y="215" width="150" height="110" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="710" y="250" text-anchor="middle" class="k">功能对齐</text><text x="710" y="276" text-anchor="middle" class="e">基准链、方向</text><text x="710" y="298" text-anchor="middle" class="e">装配坐标</text><rect x="820" y="215" width="150" height="110" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="895" y="250" text-anchor="middle" class="k">结果与模式</text><text x="895" y="276" text-anchor="middle" class="e">色谱、截面、孔群</text><text x="895" y="298" text-anchor="middle" class="e">间隙与趋势</text><rect x="1005" y="215" width="110" height="110" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="1060" y="250" text-anchor="middle" class="k">审批</text><text x="1060" y="276" text-anchor="middle" class="e">放行</text><text x="1060" y="298" text-anchor="middle" class="e">调查/复验</text></g>
  <path d="M230 270H255M415 270H440M600 270H625M785 270H810M970 270H995" class="ln"/>
  <g class="t"><rect x="165" y="410" width="260" height="75" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="295" y="440" text-anchor="middle" class="k">版本链 / Configuration</text><text x="295" y="465" text-anchor="middle" class="e">CAD、工装、模板、软件、审批</text><rect x="470" y="410" width="260" height="75" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="600" y="440" text-anchor="middle" class="k">身份链 / Identity</text><text x="600" y="465" text-anchor="middle" class="e">零件、批次、工位、模具、人员</text><rect x="775" y="410" width="260" height="75" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="905" y="440" text-anchor="middle" class="k">证据链 / Evidence</text><text x="905" y="465" text-anchor="middle" class="e">原始数据、复算、复扫、参考方法</text></g>
  <path d="M295 410V360H1060V335M600 410V360M905 410V360" stroke="#7c8f9d" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
  <rect x="115" y="555" width="970" height="42" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="582" text-anchor="middle" class="t e">最终判定来自经批准的质量规则，示意流程不替代企业程序 / Final decisions require approved quality procedures</text>
</svg>

