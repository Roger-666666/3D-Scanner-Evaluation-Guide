<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Free-state and clamped-state sheet-metal comparison</title><desc id="desc">Conceptual comparison showing that free-state, locating and clamped states answer different inspection questions.</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.base{stroke:#617a89;stroke-width:3;fill:none}.part{stroke:#2c789f;stroke-width:8;fill:none}.ref{stroke:#b8c5ce;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs>
  <rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/>
  <text x="78" y="96" class="t h">同一钣金件的三种状态，回答三类不同问题</text><text x="78" y="130" class="t s">Free, located and clamped states must not share an unqualified acceptance rule</text>
  <g transform="translate(75 190)" class="t"><rect width="315" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="157" y="38" text-anchor="middle" class="k">自由态 / Free state</text><path d="M45 205Q150 105 270 190" class="part"/><path d="M45 175Q150 135 270 175" class="ref"/><text x="157" y="246" text-anchor="middle" class="b">观察自然回弹与整体形态</text><text x="157" y="271" text-anchor="middle" class="e">Low-intervention support</text>
  <rect x="360" width="315" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="517" y="38" text-anchor="middle" class="k">定位态 / Located state</text><path d="M405 193Q510 118 630 184" class="part"/><path d="M405 175Q510 135 630 175" class="ref"/><circle cx="420" cy="205" r="10" fill="#c58a2a"/><circle cx="615" cy="196" r="10" fill="#c58a2a"/><text x="517" y="246" text-anchor="middle" class="b">复核基准与方向关系</text><text x="517" y="271" text-anchor="middle" class="e">Datums and clocking only</text>
  <rect x="720" width="315" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="877" y="38" text-anchor="middle" class="k">夹持态 / Clamped state</text><path d="M765 179Q870 139 990 178" class="part"/><path d="M765 175Q870 135 990 175" class="ref"/><path d="M790 85V158M950 85V158" stroke="#b85a50" stroke-width="5"/><path d="M775 85H805M935 85H965" stroke="#b85a50" stroke-width="8"/><text x="877" y="246" text-anchor="middle" class="b">模拟装配约束下的接口</text><text x="877" y="271" text-anchor="middle" class="e">Controlled force and sequence</text></g>
  <g class="t"><rect x="112" y="525" width="295" height="62" rx="5" fill="#d8edf7" stroke="#4f8daf"/><text x="259" y="551" text-anchor="middle" class="b">自由态异常不等于装配失败</text><text x="259" y="574" text-anchor="middle" class="e">Free-state deviation is not assembly failure</text><rect x="452" y="525" width="295" height="62" rx="5" fill="#f6e8bc" stroke="#b58a25"/><text x="599" y="551" text-anchor="middle" class="b">夹紧改善不等于零件自然合格</text><text x="599" y="574" text-anchor="middle" class="e">Forced fit is not free-state conformance</text><rect x="792" y="525" width="295" height="62" rx="5" fill="#dceacb" stroke="#6d9147"/><text x="939" y="551" text-anchor="middle" class="b">状态必须写入报告与追溯链</text><text x="939" y="574" text-anchor="middle" class="e">State belongs in every report</text></g>
</svg>

