<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">模具可观测性分区：测到、受限、缺失与需参考验证</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">Full-field inspection requires an explicit ledger of measured, limited, missing and reference-verified regions</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <path d="M115 215 L365 160 L590 225 L535 500 L250 540 L90 410 Z" fill="#d8edf7" stroke="#4c96b8" stroke-width="3"/>
    <ellipse cx="330" cy="350" rx="115" ry="80" fill="#e4f0d6" stroke="#79a653" stroke-width="3"/>
    <path d="M430 238 L570 250 L540 420 L465 400 Z" fill="#f7e8b9" stroke="#c28a1b" stroke-width="3" opacity="0.9"/>
    <path d="M115 215 L220 190 L180 330 L90 410 Z" fill="#f3d9d6" stroke="#c75b50" stroke-width="3"/>
    <circle cx="330" cy="350" r="34" fill="#eadff1" stroke="#9270a8" stroke-width="3"/>
    <g fill="#17344a"><text x="760" y="193" font-size="20" font-weight="700">可评价 / Observable</text><text x="760" y="281" font-size="20" font-weight="700">受限 / Limited</text><text x="760" y="369" font-size="20" font-weight="700">缺失 / Missing</text><text x="760" y="457" font-size="20" font-weight="700">参考验证 / Reference</text></g>
    <g font-size="14" fill="#36566b"><text x="760" y="221">覆盖与重复性满足当前问题</text><text x="760" y="309">深腔、锐边或高反光降低可信度</text><text x="760" y="397">遮挡或不可达，不得默认合格</text><text x="760" y="485">用批准的其他方法补充证据</text></g>
    <g><rect x="700" y="172" width="38" height="38" fill="#d8edf7" stroke="#4c96b8"/><rect x="700" y="260" width="38" height="38" fill="#f7e8b9" stroke="#c28a1b"/><rect x="700" y="348" width="38" height="38" fill="#f3d9d6" stroke="#c75b50"/><rect x="700" y="436" width="38" height="38" fill="#eadff1" stroke="#9270a8"/></g>
    <rect x="86" y="587" width="1028" height="36" rx="4" fill="#edf1f3"/><text x="600" y="610" text-anchor="middle" font-size="13" fill="#607483">分区表达证据状态，不代表公差或测量结果 / Zones express evidence status, not tolerance</text>
  </g>
</svg>
