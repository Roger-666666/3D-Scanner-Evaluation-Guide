<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">分阶段修正闸门：每次只放行有证据的下一步</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">Staged correction gates separate baseline, action, target verification, protection review and release</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607483"/></marker></defs>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(65 185)"><rect width="180" height="220" rx="6" fill="#e7f2f8" stroke="#4c96b8" stroke-width="3"/><text x="90" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#17344a">基线冻结</text><text x="90" y="75" text-anchor="middle" font-size="13" fill="#607483">Freeze baseline</text><text x="90" y="125" text-anchor="middle" font-size="14" fill="#36566b">对象与状态</text><text x="90" y="154" text-anchor="middle" font-size="14" fill="#36566b">参考与对齐</text><text x="90" y="183" text-anchor="middle" font-size="14" fill="#36566b">盲区与保护区</text></g>
    <g transform="translate(285 185)"><rect width="180" height="220" rx="6" fill="#fbf3dc" stroke="#c28a1b" stroke-width="3"/><text x="90" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#17344a">修正 A</text><text x="90" y="75" text-anchor="middle" font-size="13" fill="#607483">Correction A</text><text x="90" y="125" text-anchor="middle" font-size="14" fill="#36566b">最小作用范围</text><text x="90" y="154" text-anchor="middle" font-size="14" fill="#36566b">批准动作</text><text x="90" y="183" text-anchor="middle" font-size="14" fill="#36566b">版本留痕</text></g>
    <g transform="translate(505 185)"><rect width="180" height="220" rx="6" fill="#edf4e4" stroke="#79a653" stroke-width="3"/><text x="90" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#17344a">目标复测</text><text x="90" y="75" text-anchor="middle" font-size="13" fill="#607483">Target check</text><text x="90" y="125" text-anchor="middle" font-size="14" fill="#36566b">目标区趋势</text><text x="90" y="154" text-anchor="middle" font-size="14" fill="#36566b">同模板对比</text><text x="90" y="183" text-anchor="middle" font-size="14" fill="#36566b">证据充分性</text></g>
    <g transform="translate(725 185)"><rect width="180" height="220" rx="6" fill="#f3eaf6" stroke="#9270a8" stroke-width="3"/><text x="90" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#17344a">保护区复核</text><text x="90" y="75" text-anchor="middle" font-size="13" fill="#607483">Protection review</text><text x="90" y="125" text-anchor="middle" font-size="14" fill="#36566b">邻接面</text><text x="90" y="154" text-anchor="middle" font-size="14" fill="#36566b">基准与孔位</text><text x="90" y="183" text-anchor="middle" font-size="14" fill="#36566b">组合关系</text></g>
    <g transform="translate(945 185)"><rect width="180" height="220" rx="6" fill="#dff0e5" stroke="#4b8b64" stroke-width="3"/><text x="90" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#17344a">放行下一步</text><text x="90" y="75" text-anchor="middle" font-size="13" fill="#607483">Release next step</text><text x="90" y="125" text-anchor="middle" font-size="14" fill="#36566b">继续修正 B</text><text x="90" y="154" text-anchor="middle" font-size="14" fill="#36566b">转入试模</text><text x="90" y="183" text-anchor="middle" font-size="14" fill="#36566b">或回滚复盘</text></g>
    <path d="M247 295 H277 M467 295 H497 M687 295 H717 M907 295 H937" stroke="#607483" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M815 415 V470 H375 V415" fill="none" stroke="#c75b50" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="595" y="497" text-anchor="middle" font-size="14" fill="#783b36">保护区异常或证据不足：停止放行，回到动作定义</text>
    <rect x="90" y="545" width="1020" height="74" rx="4" fill="#edf1f3"/><text x="600" y="570" text-anchor="middle" font-size="14" fill="#36566b">闸门回答的是“下一步是否有资格执行”，不是自动生成修模量。</text><text x="600" y="594" text-anchor="middle" font-size="13" fill="#607483">The gate controls decision eligibility; it does not calculate an automatic mold-correction amount.</text>
  </g>
</svg>
