<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">模具状态合同：比较之前先固定工况语义</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">A mold-state contract records the conditions that make two inspection results comparable</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(65 160)"><rect width="245" height="330" rx="6" fill="#e7f2f8" stroke="#4c96b8" stroke-width="2"/><text x="122" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#17344a">冷态清洁</text><text x="122" y="70" text-anchor="middle" font-size="13" fill="#607483">Cold &amp; cleaned</text><circle cx="122" cy="145" r="46" fill="#fff" stroke="#4c96b8" stroke-width="5"/><path d="M100 145 H144 M122 123 V167" stroke="#4c96b8" stroke-width="5"/><text x="122" y="235" text-anchor="middle" font-size="15" fill="#36566b">表面可见性</text><text x="122" y="263" text-anchor="middle" font-size="15" fill="#36566b">清洁与等待时间</text><text x="122" y="291" text-anchor="middle" font-size="15" fill="#36566b">拆装状态</text></g>
    <g transform="translate(340 160)"><rect width="245" height="330" rx="6" fill="#edf4e4" stroke="#79a653" stroke-width="2"/><text x="122" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#17344a">装配定位</text><text x="122" y="70" text-anchor="middle" font-size="13" fill="#607483">Assembled &amp; located</text><rect x="73" y="105" width="98" height="82" rx="4" fill="#fff" stroke="#79a653" stroke-width="4"/><circle cx="97" cy="128" r="8" fill="#79a653"/><circle cx="147" cy="164" r="8" fill="#79a653"/><text x="122" y="235" text-anchor="middle" font-size="15" fill="#36566b">定位基准</text><text x="122" y="263" text-anchor="middle" font-size="15" fill="#36566b">镶件与滑块姿态</text><text x="122" y="291" text-anchor="middle" font-size="15" fill="#36566b">装配顺序</text></g>
    <g transform="translate(615 160)"><rect width="245" height="330" rx="6" fill="#fbf3dc" stroke="#c28a1b" stroke-width="2"/><text x="122" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#17344a">合模夹紧</text><text x="122" y="70" text-anchor="middle" font-size="13" fill="#607483">Closed &amp; clamped</text><path d="M72 120 H172 M72 175 H172" stroke="#c28a1b" stroke-width="12"/><path d="M122 90 V115 M122 180 V205" stroke="#c28a1b" stroke-width="5"/><path d="M112 105 L122 116 L132 105 M112 191 L122 180 L132 191" fill="none" stroke="#c28a1b" stroke-width="4"/><text x="122" y="235" text-anchor="middle" font-size="15" fill="#36566b">闭合姿态</text><text x="122" y="263" text-anchor="middle" font-size="15" fill="#36566b">载荷条件</text><text x="122" y="291" text-anchor="middle" font-size="15" fill="#36566b">可测与不可测边界</text></g>
    <g transform="translate(890 160)"><rect width="245" height="330" rx="6" fill="#f3eaf6" stroke="#9270a8" stroke-width="2"/><text x="122" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#17344a">试模工况</text><text x="122" y="70" text-anchor="middle" font-size="13" fill="#607483">Trial process state</text><path d="M73 175 Q122 85 171 175 Z" fill="#fff" stroke="#9270a8" stroke-width="4"/><path d="M91 165 Q122 116 153 165" fill="none" stroke="#c75b50" stroke-width="4"/><text x="122" y="235" text-anchor="middle" font-size="15" fill="#36566b">温度与时间点</text><text x="122" y="263" text-anchor="middle" font-size="15" fill="#36566b">材料与工艺条件</text><text x="122" y="291" text-anchor="middle" font-size="15" fill="#36566b">制件响应证据</text></g>
    <path d="M312 325 H332 M587 325 H607 M862 325 H882" stroke="#36566b" stroke-width="3" stroke-dasharray="7 6"/>
    <rect x="90" y="535" width="1020" height="84" rx="4" fill="#edf1f3"/><text x="600" y="561" text-anchor="middle" font-size="14" font-weight="700" fill="#36566b">合同字段：对象身份 · 温度状态 · 清洁方式 · 装配姿态 · 夹紧条件 · 时间点 · 对齐模板</text><text x="600" y="588" text-anchor="middle" font-size="13" fill="#607483">不同状态不能直接混成一张因果图；必须先声明可比项与桥接证据。</text><text x="600" y="608" text-anchor="middle" font-size="13" fill="#607483">Different states require declared comparability and bridging evidence before causal interpretation.</text>
  </g>
</svg>
