<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">覆盖可信度矩阵：有网格不等于有判定资格</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">Mesh presence, repeatability, edge quality and reference agreement jointly determine decision use</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <g fill="#d8edf7" stroke="#4c96b8"><rect x="82" y="168" width="280" height="62"/><rect x="362" y="168" width="180" height="62"/><rect x="542" y="168" width="180" height="62"/><rect x="722" y="168" width="180" height="62"/><rect x="902" y="168" width="216" height="62"/></g>
    <g fill="#17344a" font-size="16" font-weight="700"><text x="222" y="206">数据状态</text><text x="452" y="206">重复性</text><text x="632" y="206">边界质量</text><text x="812" y="206">参考一致</text><text x="1010" y="206">决策用途</text></g>
    <g font-size="15" fill="#29485d">
      <g stroke="#c6d2da"><rect x="82" y="230" width="280" height="78" fill="#f8fafb"/><rect x="362" y="230" width="180" height="78" fill="#e4f0d6"/><rect x="542" y="230" width="180" height="78" fill="#e4f0d6"/><rect x="722" y="230" width="180" height="78" fill="#e4f0d6"/><rect x="902" y="230" width="216" height="78" fill="#e4f0d6"/></g><text x="222" y="276">完整且稳定</text><text x="452" y="276">保持</text><text x="632" y="276">清晰</text><text x="812" y="276">支持</text><text x="1010" y="276">正式评价候选</text>
      <g stroke="#c6d2da"><rect x="82" y="308" width="280" height="78" fill="#f8fafb"/><rect x="362" y="308" width="180" height="78" fill="#e4f0d6"/><rect x="542" y="308" width="180" height="78" fill="#f7e8b9"/><rect x="722" y="308" width="180" height="78" fill="#f7e8b9"/><rect x="902" y="308" width="216" height="78" fill="#f7e8b9"/></g><text x="222" y="354">网格存在但边界弱</text><text x="452" y="354">保持</text><text x="632" y="354">受限</text><text x="812" y="354">待补</text><text x="1010" y="354">趋势与调查</text>
      <g stroke="#c6d2da"><rect x="82" y="386" width="280" height="78" fill="#f8fafb"/><rect x="362" y="386" width="180" height="78" fill="#f3d9d6"/><rect x="542" y="386" width="180" height="78" fill="#edf1f3"/><rect x="722" y="386" width="180" height="78" fill="#edf1f3"/><rect x="902" y="386" width="216" height="78" fill="#f3d9d6"/></g><text x="222" y="432">随视角或拼接移动</text><text x="452" y="432">不稳定</text><text x="632" y="432">不适用</text><text x="812" y="432">未知</text><text x="1010" y="432">停止修模判断</text>
      <g stroke="#c6d2da"><rect x="82" y="464" width="280" height="78" fill="#f8fafb"/><rect x="362" y="464" width="180" height="78" fill="#edf1f3"/><rect x="542" y="464" width="180" height="78" fill="#f3d9d6"/><rect x="722" y="464" width="180" height="78" fill="#eadff1"/><rect x="902" y="464" width="216" height="78" fill="#eadff1"/></g><text x="222" y="510">区域缺失</text><text x="452" y="510">无法判断</text><text x="632" y="510">无数据</text><text x="812" y="510">外部方法</text><text x="1010" y="510">参考验证</text>
    </g>
    <rect x="82" y="582" width="1036" height="34" rx="4" fill="#edf1f3"/><text x="600" y="604" font-size="13" fill="#607483">矩阵用于证据分流，不自动赋予合格状态 / The matrix routes evidence; it does not assign acceptance</text>
  </g>
</svg>
