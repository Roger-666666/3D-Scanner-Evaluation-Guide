<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Complex part measurement evidence loop</title>
  <desc id="desc">Conceptual workflow from task definition through acquisition, coverage review, CAD comparison, engineering review and controlled reuse.</desc>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#506579"/></marker>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#142c3f}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#53687a}.k{font-size:18px;font-weight:700}.b{font-size:15px}.e{font-size:13px;fill:#456174}.line{stroke:#506579;stroke-width:3;fill:none;marker-end:url(#arrow3)}</style>
  </defs>
  <rect width="1200" height="680" fill="#f3f6f8"/>
  <rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/>
  <text x="78" y="96" class="t h">复杂零件测量闭环：速度只有进入受控证据链才有价值</text>
  <text x="78" y="130" class="t s">A controlled evidence loop from task definition to reusable inspection template</text>

  <rect x="72" y="190" width="160" height="100" rx="6" fill="#e6ddea" stroke="#8b70a7"/>
  <text x="152" y="226" text-anchor="middle" class="t k">任务定义</text><text x="152" y="254" text-anchor="middle" class="t b">对象 / CAD / 特征</text><text x="152" y="276" text-anchor="middle" class="t e">Task definition</text>
  <path d="M232 240 H272" class="line"/>
  <rect x="278" y="190" width="160" height="100" rx="6" fill="#f6e8bc" stroke="#b58a25"/>
  <text x="358" y="226" text-anchor="middle" class="t k">方案确认</text><text x="358" y="254" text-anchor="middle" class="t b">幅面 / 视角 / 工装</text><text x="358" y="276" text-anchor="middle" class="t e">Plan confirmation</text>
  <path d="M438 240 H478" class="line"/>
  <rect x="484" y="190" width="160" height="100" rx="6" fill="#d8edf7" stroke="#4f8daf"/>
  <text x="564" y="226" text-anchor="middle" class="t k">受控采集</text><text x="564" y="254" text-anchor="middle" class="t b">多视角 / 状态日志</text><text x="564" y="276" text-anchor="middle" class="t e">Controlled capture</text>
  <path d="M644 240 H684" class="line"/>
  <rect x="690" y="190" width="160" height="100" rx="6" fill="#dceacb" stroke="#6d9147"/>
  <text x="770" y="226" text-anchor="middle" class="t k">覆盖审计</text><text x="770" y="254" text-anchor="middle" class="t b">缺失 / 边缘 / 拼接</text><text x="770" y="276" text-anchor="middle" class="t e">Coverage audit</text>
  <path d="M850 240 H890" class="line"/>
  <rect x="896" y="190" width="232" height="100" rx="6" fill="#edf1f3" stroke="#82939d"/>
  <text x="1012" y="226" text-anchor="middle" class="t k">数据是否可评价？</text><text x="1012" y="254" text-anchor="middle" class="t b">不能用补洞代替真实证据</text><text x="1012" y="276" text-anchor="middle" class="t e">Is the data evaluable?</text>

  <path d="M1012 290 V352 H850" class="line"/>
  <rect x="690" y="330" width="160" height="100" rx="6" fill="#d8edf7" stroke="#4f8daf"/>
  <text x="770" y="366" text-anchor="middle" class="t k">对齐与分析</text><text x="770" y="394" text-anchor="middle" class="t b">CAD / 尺寸 / GD&amp;T</text><text x="770" y="416" text-anchor="middle" class="t e">Alignment and analysis</text>
  <path d="M690 380 H650" class="line"/>
  <rect x="484" y="330" width="166" height="100" rx="6" fill="#f6e8bc" stroke="#b58a25"/>
  <text x="567" y="366" text-anchor="middle" class="t k">工程复核</text><text x="567" y="394" text-anchor="middle" class="t b">模式 / 假设 / 旁证</text><text x="567" y="416" text-anchor="middle" class="t e">Engineering review</text>
  <path d="M484 380 H444" class="line"/>
  <rect x="278" y="330" width="166" height="100" rx="6" fill="#dceacb" stroke="#6d9147"/>
  <text x="361" y="366" text-anchor="middle" class="t k">质量处置</text><text x="361" y="394" text-anchor="middle" class="t b">放行 / 调查 / 返工</text><text x="361" y="416" text-anchor="middle" class="t e">Quality disposition</text>
  <path d="M278 380 H238" class="line"/>
  <rect x="72" y="330" width="166" height="100" rx="6" fill="#e6ddea" stroke="#8b70a7"/>
  <text x="155" y="366" text-anchor="middle" class="t k">模板受控复用</text><text x="155" y="394" text-anchor="middle" class="t b">版本 / 规则 / 审批</text><text x="155" y="416" text-anchor="middle" class="t e">Controlled reuse</text>

  <path d="M155 330 V312 H152 V290" class="line"/>
  <path d="M1012 290 V500 H564 V430" fill="none" stroke="#c07555" stroke-width="3" marker-end="url(#arrow3)"/>
  <text x="790" y="462" text-anchor="middle" class="t b" fill="#9c5236">证据不足：补扫或修订方案</text>
  <text x="790" y="486" text-anchor="middle" class="t e" fill="#9c5236">Insufficient evidence: rescan or revise</text>

  <rect x="120" y="520" width="960" height="68" rx="6" fill="#f8fafb" stroke="#c1ccd4"/>
  <text x="600" y="549" text-anchor="middle" class="t b">每一步保留：零件身份、配置状态、原始数据、处理版本、覆盖状态、报告与审批记录</text>
  <text x="600" y="574" text-anchor="middle" class="t e">Retain identity, configuration, raw data, processing version, coverage state, report and approval record</text>
  <text x="78" y="620" class="t e">概念流程，不替代企业测量程序、MSA或产品放行规范 / Conceptual workflow; it does not replace an approved measurement procedure, MSA or release specification</text>
</svg>
