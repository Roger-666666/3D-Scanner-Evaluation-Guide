<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Injection molded part deviation diagnosis and verification loop</title>
  <desc id="desc">A structured loop that separates deviation observation, measurement validation, geometric classification, process hypotheses, controlled trials, and comparable reinspection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3B5873"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#F4F7FA"/>
  <rect x="34" y="34" width="1132" height="607" rx="6" fill="#FFFFFF" stroke="#C8D7E6" stroke-width="2"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#102F52">FROM DEVIATION OBSERVATION TO VERIFIED PROCESS ACTION</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="15" fill="#49657F">A color map is evidence of geometry, not automatic proof of molding root cause</text>

  <g stroke="#3B5873" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M262 243H311"/>
    <path d="M503 243H552"/>
    <path d="M744 243H793"/>
    <path d="M914 320V391"/>
    <path d="M793 482H744"/>
    <path d="M552 482H503"/>
    <path d="M311 482H262"/>
    <path d="M141 391V320"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="160" width="192" height="160" rx="6" fill="#EAF3F9" stroke="#8EB0C8" stroke-width="2"/>
    <text x="92" y="196" font-size="15" font-weight="700" fill="#14375B">OBSERVE PATTERN</text>
    <path d="M95 278H237L226 291H106Z" fill="#57BC76" stroke="#173C61" stroke-width="2"/>
    <ellipse cx="164" cy="267" rx="40" ry="18" fill="#F2CD52"/>
    <ellipse cx="205" cy="275" rx="23" ry="12" fill="#EF7E55"/>
    <text x="92" y="307" font-size="12" fill="#49657F">global map · section · feature</text>

    <rect x="311" y="160" width="192" height="160" rx="6" fill="#EEF8F4" stroke="#82B7A8" stroke-width="2"/>
    <text x="333" y="196" font-size="15" font-weight="700" fill="#14375B">VALIDATE MEASUREMENT</text>
    <circle cx="357" cy="254" r="22" fill="#76C7BA" stroke="#173C61" stroke-width="2"/>
    <path d="M345 254L354 263L371 243" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <text x="391" y="246" font-size="12" fill="#264866">coverage · support</text>
    <text x="391" y="269" font-size="12" fill="#264866">alignment · repeat</text>
    <text x="333" y="307" font-size="12" fill="#49657F">exclude interpolation and setup error</text>

    <rect x="552" y="160" width="192" height="160" rx="6" fill="#FFF8E3" stroke="#D4B649" stroke-width="2"/>
    <text x="574" y="196" font-size="15" font-weight="700" fill="#14375B">CLASSIFY GEOMETRY</text>
    <rect x="578" y="225" width="53" height="53" rx="4" fill="#F2CD52" stroke="#173C61"/>
    <rect x="640" y="225" width="33" height="53" rx="4" fill="#EF7E55" stroke="#173C61"/>
    <rect x="682" y="225" width="35" height="53" rx="4" fill="#52A7CD" stroke="#173C61"/>
    <text x="574" y="307" font-size="12" fill="#49657F">form · position · profile · local feature</text>

    <rect x="793" y="160" width="242" height="160" rx="6" fill="#FDEFEA" stroke="#D69C80" stroke-width="2"/>
    <text x="815" y="196" font-size="15" font-weight="700" fill="#14375B">BUILD TESTABLE HYPOTHESES</text>
    <g font-size="12" fill="#264866">
      <circle cx="824" cy="230" r="5" fill="#EF7E55"/><text x="838" y="235">material and conditioning</text>
      <circle cx="824" cy="257" r="5" fill="#F2CD52"/><text x="838" y="262">mold, vent, gate, or wear</text>
      <circle cx="824" cy="284" r="5" fill="#52A7CD"/><text x="838" y="289">packing, cooling, ejection, fixture</text>
    </g>
    <text x="815" y="307" font-size="12" fill="#49657F">rank with process evidence</text>

    <rect x="793" y="391" width="242" height="183" rx="6" fill="#F3EFF9" stroke="#AC97C1" stroke-width="2"/>
    <text x="815" y="427" font-size="15" font-weight="700" fill="#14375B">CONTROLLED TRIAL</text>
    <path d="M825 495H1001" stroke="#B49ACB" stroke-width="5"/>
    <circle cx="842" cy="495" r="12" fill="#FFFFFF" stroke="#173C61" stroke-width="3"/>
    <circle cx="913" cy="495" r="12" fill="#FFFFFF" stroke="#173C61" stroke-width="3"/>
    <circle cx="984" cy="495" r="12" fill="#FFFFFF" stroke="#173C61" stroke-width="3"/>
    <text x="815" y="535" font-size="12" fill="#49657F">change one controlled factor · preserve identity</text>
    <text x="815" y="555" font-size="12" fill="#49657F">link trial, material, mold, and process records</text>

    <rect x="552" y="391" width="192" height="183" rx="6" fill="#EAF7F6" stroke="#75B8B0" stroke-width="2"/>
    <text x="574" y="427" font-size="15" font-weight="700" fill="#14375B">COMPARABLE RE-SCAN</text>
    <path d="M592 503A49 49 0 1 1 674 537" fill="none" stroke="#2F9D92" stroke-width="7"/>
    <path d="M673 517L682 540L658 537Z" fill="#2F9D92"/>
    <text x="574" y="555" font-size="12" fill="#49657F">same datum · template · state</text>

    <rect x="311" y="391" width="192" height="183" rx="6" fill="#EDF5F8" stroke="#8EB0C8" stroke-width="2"/>
    <text x="333" y="427" font-size="15" font-weight="700" fill="#14375B">DECIDE &amp; ARCHIVE</text>
    <rect x="337" y="462" width="139" height="72" rx="4" fill="#FFFFFF" stroke="#8EB0C8"/>
    <line x1="353" y1="480" x2="458" y2="480" stroke="#57BC76" stroke-width="4"/>
    <line x1="353" y1="497" x2="437" y2="497" stroke="#F2CD52" stroke-width="4"/>
    <line x1="353" y1="514" x2="465" y2="514" stroke="#EF7E55" stroke-width="4"/>
    <text x="333" y="555" font-size="12" fill="#49657F">accept · correct · contain · monitor</text>

    <rect x="70" y="391" width="192" height="183" rx="6" fill="#FFF2F2" stroke="#D49A9E" stroke-width="2"/>
    <text x="92" y="427" font-size="15" font-weight="700" fill="#14375B">TREND &amp; ESCALATE</text>
    <polyline points="96,525 126,504 157,511 188,472 232,486" fill="none" stroke="#D95059" stroke-width="4"/>
    <line x1="96" y1="540" x2="234" y2="540" stroke="#8EB0C8" stroke-width="2"/>
    <text x="92" y="555" font-size="12" fill="#49657F">batch drift · recurrence · review trigger</text>
  </g>

  <rect x="70" y="345" width="965" height="28" rx="4" fill="#E9F1F7"/>
  <text x="92" y="365" font-family="Arial, sans-serif" font-size="13" fill="#264866">Evidence chain: part and cavity ID · material lot · mold state · process window · measurement template · disposition</text>

  <text x="70" y="611" font-family="Arial, sans-serif" font-size="14" fill="#264866">Never convert a single red or blue zone directly into a molding adjustment without measurement and process verification.</text>
  <text x="941" y="611" font-family="Arial, sans-serif" font-size="13" fill="#6A8097">ENGINEERING ILLUSTRATION</text>
</svg>
