<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">逆向工程交付阶梯：扫描网格不是参数化CAD</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Each deliverable supports a different downstream task and carries different engineering meaning</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(80 475)"><rect width="250" height="110" rx="6" fill="#e0f0f7" stroke="#4b97b9" stroke-width="3"/><text x="125" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">点云 / 网格</text><text x="125" y="72" text-anchor="middle" font-size="14" fill="#36596c">表面观察与数字存档</text></g>
    <g transform="translate(290 355)"><rect width="250" height="110" rx="6" fill="#edf4e4" stroke="#7aa553" stroke-width="3"/><text x="125" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">拟合曲面</text><text x="125" y="72" text-anchor="middle" font-size="14" fill="#36596c">轮廓与自由曲面表达</text></g>
    <g transform="translate(500 235)"><rect width="250" height="110" rx="6" fill="#fbf1d9" stroke="#c28b21" stroke-width="3"/><text x="125" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">参数化实体</text><text x="125" y="72" text-anchor="middle" font-size="14" fill="#36596c">特征、约束与可编辑尺寸</text></g>
    <g transform="translate(710 115)"><rect width="250" height="110" rx="6" fill="#efe7f4" stroke="#9471aa" stroke-width="3"/><text x="125" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">工程图与规范</text><text x="125" y="72" text-anchor="middle" font-size="14" fill="#36596c">基准、GD&amp;T与制造语义</text></g>
    <path d="M330 520 L400 465 M540 400 L610 345 M750 280 L820 225" stroke="#607583" stroke-width="4"/>
    <rect x="815" y="365" width="290" height="160" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="960" y="405" text-anchor="middle" font-size="18" font-weight="700" fill="#15364b">交付前先问用途</text><text x="960" y="440" text-anchor="middle" font-size="14" fill="#36596c">存档 · 比对 · 改型</text><text x="960" y="468" text-anchor="middle" font-size="14" fill="#36596c">加工 · 仿真 · 备件</text><text x="960" y="498" text-anchor="middle" font-size="13" fill="#607583">Archive · inspect · redesign · manufacture</text>
    <text x="600" y="625" text-anchor="middle" font-size="13" fill="#607583">阶梯表示工程语义增加，不表示软件自动完成全部转换 / The ladder shows added semantics, not an automatic conversion promise</text>
  </g>
</svg>

