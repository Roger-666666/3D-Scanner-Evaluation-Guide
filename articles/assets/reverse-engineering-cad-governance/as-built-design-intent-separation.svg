<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">实物状态与设计意图分离：不要把磨损和变形写进新CAD</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">As-built geometry is evidence; design intent requires classification and engineering decisions</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(70 170)"><rect width="300" height="330" rx="6" fill="#e0f0f7" stroke="#4b97b9" stroke-width="3"/><text x="150" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#15364b">扫描实物状态</text><text x="150" y="72" text-anchor="middle" font-size="13" fill="#607583">As-built evidence</text><path d="M55 190 Q90 110 130 160 Q170 220 245 115" fill="none" stroke="#4b97b9" stroke-width="9"/><circle cx="100" cy="148" r="12" fill="#c75e53"/><circle cx="195" cy="180" r="12" fill="#c28b21"/><text x="150" y="275" text-anchor="middle" font-size="14" fill="#36596c">制造偏差 · 磨损 · 变形 · 污染</text></g>
    <g transform="translate(450 170)"><rect width="300" height="330" rx="6" fill="#fbf1d9" stroke="#c28b21" stroke-width="3"/><text x="150" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#15364b">工程分类</text><text x="150" y="72" text-anchor="middle" font-size="13" fill="#607583">Engineering classification</text><rect x="55" y="110" width="190" height="44" rx="4" fill="#fff"/><text x="150" y="138" text-anchor="middle" font-size="14" fill="#36596c">保留：功能与装配特征</text><rect x="55" y="170" width="190" height="44" rx="4" fill="#fff"/><text x="150" y="198" text-anchor="middle" font-size="14" fill="#36596c">修复：磨损与偶发损伤</text><rect x="55" y="230" width="190" height="44" rx="4" fill="#fff"/><text x="150" y="258" text-anchor="middle" font-size="14" fill="#36596c">待定：未知工艺痕迹</text></g>
    <g transform="translate(830 170)"><rect width="300" height="330" rx="6" fill="#edf4e4" stroke="#7aa553" stroke-width="3"/><text x="150" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#15364b">目标CAD</text><text x="150" y="72" text-anchor="middle" font-size="13" fill="#607583">Target CAD</text><path d="M55 190 Q120 120 180 160 Q220 185 245 115" fill="none" stroke="#7aa553" stroke-width="9"/><path d="M55 230 H245" stroke="#7aa553" stroke-width="4" stroke-dasharray="8 7"/><text x="150" y="275" text-anchor="middle" font-size="14" fill="#36596c">可编辑特征 · 明确基准 · 受控修复</text></g>
    <path d="M372 335 H442 M752 335 H822" stroke="#607583" stroke-width="4"/>
    <rect x="90" y="550" width="1020" height="68" rx="4" fill="#f3d9d6"/><text x="600" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#783c37">不能从扫描表面自动推断所有原始设计意图；未知项必须保留假设标签。</text><text x="600" y="600" text-anchor="middle" font-size="13" fill="#783c37">Unknown intent remains a hypothesis until supported by drawings, mating parts or engineering review.</text>
  </g>
</svg>

