<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">可见性账本：把“已测得”与“尚未知”画在同一张图上</text><text x="65" y="112" font-size="15" fill="#607583">A visibility ledger prevents inaccessible geometry from being mistaken for measured data</text>
  <g transform="translate(110 175)"><path d="M70 30 H650 V140 H520 V365 H390 V190 H70 Z" fill="#dff0e5" stroke="#2f6f8f" stroke-width="5"/><path d="M390 190 H520 V365 H390 Z" fill="#d8d7e8" stroke="#6f5a91" stroke-width="4" stroke-dasharray="12 9"/><path d="M70 30 H650 V75 H70 Z" fill="#b9dce7" opacity=".9"/><path d="M70 190 H390 V365 H70 Z" fill="#f7e8b9" opacity=".9"/><circle cx="190" cy="110" r="42" fill="#fff" stroke="#2f6f8f" stroke-width="4"/><circle cx="540" cy="110" r="42" fill="#fff" stroke="#2f6f8f" stroke-width="4"/>
  <g font-size="15" fill="#15364b"><text x="240" y="58">可直接观测</text><text x="150" y="275">视角受限</text><text x="420" y="285">隐藏 / 不可见</text></g></g>
  <g transform="translate(820 190)" font-size="15" fill="#36596c"><rect width="26" height="26" fill="#b9dce7"/><text x="42" y="19">可直接观测</text><rect y="70" width="26" height="26" fill="#f7e8b9"/><text x="42" y="89">有限可见，需补充视角</text><rect y="140" width="26" height="26" fill="#d8d7e8"/><text x="42" y="159">隐藏区域，保持未知</text><rect y="210" width="26" height="26" fill="#fff" stroke="#d08a2e" stroke-width="3"/><text x="42" y="229">外部证据支持的推断</text></g>
  <path d="M755 505 H1070" stroke="#d08a2e" stroke-width="3" stroke-dasharray="10 7"/><text x="912" y="540" text-anchor="middle" font-size="14" fill="#8a5a22">推断必须携带来源、责任人与复核状态</text><text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">示意图不表示任何具体零件或扫描结果 / Conceptual geometry only</text></g>
</svg>

