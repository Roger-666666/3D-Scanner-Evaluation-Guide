<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b7c7d1" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">混线检测配方路由：先匹配身份，再启动自动检测</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Production-line routing binds part identity, CAD, fixture, alignment and report rules</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#607583"/></marker></defs>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(65 210)"><rect width="180" height="210" rx="6" fill="#e0f0f7" stroke="#4b97b9" stroke-width="3"/><text x="90" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">零件身份</text><text x="90" y="78" text-anchor="middle" font-size="13" fill="#607583">Part identity</text><text x="90" y="128" text-anchor="middle" font-size="14" fill="#36596c">型号 · 版本</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#36596c">材料 · 工序</text></g>
    <g transform="translate(285 210)"><rect width="180" height="210" rx="6" fill="#edf4e4" stroke="#7aa553" stroke-width="3"/><text x="90" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">配方清单</text><text x="90" y="78" text-anchor="middle" font-size="13" fill="#607583">Recipe manifest</text><text x="90" y="128" text-anchor="middle" font-size="14" fill="#36596c">CAD · 夹具</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#36596c">路径 · 对齐</text></g>
    <g transform="translate(505 210)"><rect width="180" height="210" rx="6" fill="#fbf1d9" stroke="#c28b21" stroke-width="3"/><text x="90" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">采集与分析</text><text x="90" y="78" text-anchor="middle" font-size="13" fill="#607583">Acquire &amp; analyze</text><text x="90" y="128" text-anchor="middle" font-size="14" fill="#36596c">覆盖 · 特征</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#36596c">GD&amp;T · 截面</text></g>
    <g transform="translate(725 210)"><rect width="180" height="210" rx="6" fill="#efe7f4" stroke="#9471aa" stroke-width="3"/><text x="90" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">结果路由</text><text x="90" y="78" text-anchor="middle" font-size="13" fill="#607583">Result routing</text><text x="90" y="128" text-anchor="middle" font-size="14" fill="#36596c">放行 · 复核</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#36596c">隔离 · 补测</text></g>
    <g transform="translate(945 210)"><rect width="180" height="210" rx="6" fill="#dff0e5" stroke="#4d8d65" stroke-width="3"/><text x="90" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">追溯记录</text><text x="90" y="78" text-anchor="middle" font-size="13" fill="#607583">Trace record</text><text x="90" y="128" text-anchor="middle" font-size="14" fill="#36596c">原始数据</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#36596c">版本与处置</text></g>
    <path d="M247 315 H277 M467 315 H497 M687 315 H717 M907 315 H937" stroke="#607583" stroke-width="4" marker-end="url(#a)"/>
    <path d="M375 430 V500 H155 V430" fill="none" stroke="#c75e53" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="265" y="530" text-anchor="middle" font-size="14" fill="#783c37">身份或版本不匹配：停止自动流程</text>
    <rect x="90" y="570" width="1020" height="48" rx="4" fill="#e9eef1"/><text x="600" y="599" text-anchor="middle" font-size="13" fill="#607583">自动化重复执行已验证配方，不会自动保证配方本身正确 / Automation repeats a qualified recipe; it does not qualify the recipe by itself</text>
  </g>
</svg>
