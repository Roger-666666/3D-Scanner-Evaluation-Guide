<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b7c7d1" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">槽口与孔边截面证据：从显示轮廓到可判定轮廓</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Section evidence separates observed boundaries, limited edges and reconstructed geometry</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(75 170)"><rect width="300" height="330" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="150" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">实测边界</text><text x="150" y="68" text-anchor="middle" font-size="13" fill="#607583">Observed boundary</text><path d="M45 130 H112 Q150 130 150 168 V225 H255" fill="none" stroke="#4b97b9" stroke-width="8"/><g fill="#4b97b9"><circle cx="60" cy="130" r="4"/><circle cx="91" cy="130" r="4"/><circle cx="127" cy="137" r="4"/><circle cx="148" cy="158" r="4"/><circle cx="150" cy="195" r="4"/><circle cx="190" cy="225" r="4"/><circle cx="235" cy="225" r="4"/></g><text x="150" y="285" text-anchor="middle" font-size="14" fill="#36596c">连续、重复、方向一致</text></g>
    <g transform="translate(450 170)"><rect width="300" height="330" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="150" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">受限边界</text><text x="150" y="68" text-anchor="middle" font-size="13" fill="#607583">Limited boundary</text><path d="M45 130 H112" fill="none" stroke="#c28b21" stroke-width="8"/><path d="M150 185 V225 H255" fill="none" stroke="#c28b21" stroke-width="8"/><path d="M112 130 Q150 130 150 168 V185" fill="none" stroke="#c75e53" stroke-width="4" stroke-dasharray="7 7"/><text x="150" y="285" text-anchor="middle" font-size="14" fill="#36596c">锐边、遮挡或反光导致缺口</text></g>
    <g transform="translate(825 170)"><rect width="300" height="330" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="150" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">重建轮廓</text><text x="150" y="68" text-anchor="middle" font-size="13" fill="#607583">Reconstructed shape</text><path d="M45 130 H112 Q150 130 150 168 V225 H255" fill="none" stroke="#9471aa" stroke-width="8"/><path d="M112 130 Q150 130 150 168 V225" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 6"/><text x="150" y="285" text-anchor="middle" font-size="14" fill="#36596c">可用于可视化，不冒充直接测量</text></g>
    <path d="M377 335 H442 M752 335 H817" stroke="#607583" stroke-width="4"/><path d="M430 327 L443 335 L430 343 M805 327 L818 335 L805 343" fill="none" stroke="#607583" stroke-width="4"/>
    <rect x="90" y="545" width="1020" height="74" rx="4" fill="#f3d9d6"/><text x="600" y="573" text-anchor="middle" font-size="15" fill="#783c37">关键孔边与密封台阶若处于受限或重建状态，应停止尺寸放行并补充证据。</text><text x="600" y="599" text-anchor="middle" font-size="13" fill="#783c37">The diagram names evidence states; it does not represent measured watch-case geometry.</text>
  </g>
</svg>
