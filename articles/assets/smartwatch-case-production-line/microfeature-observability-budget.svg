<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b7c7d1" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">微特征可判定性预算：有点云不等于能判定</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Micro-feature decision eligibility depends on acquisition, boundary, repeatability and reference evidence</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(70 165)"><rect width="235" height="330" rx="6" fill="#e0f0f7" stroke="#4b97b9" stroke-width="3"/><text x="118" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">采集覆盖</text><text x="118" y="72" text-anchor="middle" font-size="13" fill="#607583">Acquisition</text><circle cx="118" cy="150" r="52" fill="#fff" stroke="#4b97b9" stroke-width="5"/><circle cx="118" cy="150" r="18" fill="#d8ebf4"/><path d="M65 150 H171 M118 97 V203" stroke="#8bbdd2" stroke-width="2" stroke-dasharray="7 6"/><text x="118" y="244" text-anchor="middle" font-size="14" fill="#36596c">视角 · 反光 · 遮挡</text><text x="118" y="274" text-anchor="middle" font-size="14" fill="#36596c">槽底与侧壁是否可见</text></g>
    <g transform="translate(345 165)"><rect width="235" height="330" rx="6" fill="#edf4e4" stroke="#7aa553" stroke-width="3"/><text x="118" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">边界质量</text><text x="118" y="72" text-anchor="middle" font-size="13" fill="#607583">Boundary quality</text><path d="M58 190 Q92 92 118 155 Q144 218 178 115" fill="none" stroke="#7aa553" stroke-width="8"/><circle cx="78" cy="145" r="7" fill="#fff" stroke="#7aa553" stroke-width="3"/><circle cx="158" cy="150" r="7" fill="#fff" stroke="#7aa553" stroke-width="3"/><text x="118" y="244" text-anchor="middle" font-size="14" fill="#36596c">孔边 · 圆角 · 槽口</text><text x="118" y="274" text-anchor="middle" font-size="14" fill="#36596c">是否被平滑或补面</text></g>
    <g transform="translate(620 165)"><rect width="235" height="330" rx="6" fill="#fbf1d9" stroke="#c28b21" stroke-width="3"/><text x="118" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">重复稳定</text><text x="118" y="72" text-anchor="middle" font-size="13" fill="#607583">Repeatability</text><path d="M48 175 Q118 100 188 175" fill="none" stroke="#c28b21" stroke-width="5"/><path d="M48 190 Q118 115 188 190" fill="none" stroke="#dbad4d" stroke-width="5"/><path d="M48 205 Q118 130 188 205" fill="none" stroke="#efd28c" stroke-width="5"/><text x="118" y="244" text-anchor="middle" font-size="14" fill="#36596c">复扫 · 重装夹 · 换视角</text><text x="118" y="274" text-anchor="middle" font-size="14" fill="#36596c">模式是否保持</text></g>
    <g transform="translate(895 165)"><rect width="235" height="330" rx="6" fill="#efe7f4" stroke="#9471aa" stroke-width="3"/><text x="118" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">参考一致</text><text x="118" y="72" text-anchor="middle" font-size="13" fill="#607583">Reference</text><rect x="58" y="110" width="120" height="95" rx="8" fill="#fff" stroke="#9471aa" stroke-width="4"/><path d="M82 160 H154 M118 124 V196" stroke="#9471aa" stroke-width="4"/><text x="118" y="244" text-anchor="middle" font-size="14" fill="#36596c">CAD · 基准 · 方向</text><text x="118" y="274" text-anchor="middle" font-size="14" fill="#36596c">对象与版本是否匹配</text></g>
    <path d="M307 330 H337 M582 330 H612 M857 330 H887" stroke="#607583" stroke-width="4"/>
    <rect x="90" y="545" width="1020" height="74" rx="4" fill="#e9eef1"/><text x="600" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="#36596c">四项同时满足，微孔与按键槽才具备进入判定的资格。</text><text x="600" y="598" text-anchor="middle" font-size="13" fill="#607583">Conceptual framework only; it does not prescribe a universal tolerance or uncertainty value.</text>
  </g>
</svg>
