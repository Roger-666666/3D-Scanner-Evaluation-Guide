<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b7c7d1" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">手表壳体三区质量门：外观、装配与密封分别判定</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Cosmetic, assembly and sealing zones require separate evidence and release logic</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(70 165)"><rect width="320" height="350" rx="6" fill="#e0f0f7" stroke="#4b97b9" stroke-width="3"/><text x="160" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#15364b">外观区</text><text x="160" y="75" text-anchor="middle" font-size="13" fill="#607583">Cosmetic zone</text><path d="M65 175 Q160 85 255 175 Q160 265 65 175" fill="#fff" stroke="#4b97b9" stroke-width="5"/><path d="M92 175 Q160 118 228 175" fill="none" stroke="#8bbdd2" stroke-width="5"/><text x="160" y="285" text-anchor="middle" font-size="15" fill="#36596c">曲面连续 · 局部面形</text><text x="160" y="312" text-anchor="middle" font-size="15" fill="#36596c">需结合外观检验</text></g>
    <g transform="translate(440 165)"><rect width="320" height="350" rx="6" fill="#edf4e4" stroke="#7aa553" stroke-width="3"/><text x="160" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#15364b">装配区</text><text x="160" y="75" text-anchor="middle" font-size="13" fill="#607583">Assembly zone</text><rect x="75" y="115" width="170" height="130" rx="30" fill="#fff" stroke="#7aa553" stroke-width="5"/><circle cx="105" cy="180" r="10" fill="#7aa553"/><circle cx="215" cy="180" r="10" fill="#7aa553"/><text x="160" y="285" text-anchor="middle" font-size="15" fill="#36596c">孔位 · 按键 · 表带接口</text><text x="160" y="312" text-anchor="middle" font-size="15" fill="#36596c">需结合实物装配</text></g>
    <g transform="translate(810 165)"><rect width="320" height="350" rx="6" fill="#fbf1d9" stroke="#c28b21" stroke-width="3"/><text x="160" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#15364b">密封区</text><text x="160" y="75" text-anchor="middle" font-size="13" fill="#607583">Sealing zone</text><rect x="65" y="110" width="190" height="140" rx="45" fill="#fff" stroke="#c28b21" stroke-width="5"/><rect x="95" y="140" width="130" height="80" rx="28" fill="none" stroke="#c75e53" stroke-width="5" stroke-dasharray="9 7"/><text x="160" y="285" text-anchor="middle" font-size="15" fill="#36596c">台阶 · 结合面 · 连续路径</text><text x="160" y="312" text-anchor="middle" font-size="15" fill="#36596c">需结合密封试验</text></g>
    <rect x="90" y="550" width="1020" height="70" rx="4" fill="#e9eef1"/><text x="600" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#36596c">一个区域放行，不能替代另两个区域的证据。</text><text x="600" y="600" text-anchor="middle" font-size="13" fill="#607583">Geometry supports each gate but does not independently certify appearance, assembly or sealing performance.</text>
  </g>
</svg>
