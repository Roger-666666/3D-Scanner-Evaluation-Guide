<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b7c7d1" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">对齐策略比较：同一壳体为何得到不同异常位置</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Alignment changes the question answered by the deviation map</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(65 165)"><rect width="330" height="340" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="165" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">整体最佳拟合</text><text x="165" y="70" text-anchor="middle" font-size="13" fill="#607583">Global best fit</text><rect x="55" y="105" width="220" height="155" rx="42" fill="#dfeef5" stroke="#4b97b9" stroke-width="4"/><path d="M70 190 Q165 110 260 190" fill="none" stroke="#c75e53" stroke-width="12"/><text x="165" y="302" text-anchor="middle" font-size="14" fill="#36596c">观察整体形态与分布</text></g>
    <g transform="translate(435 165)"><rect width="330" height="340" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="165" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">显示屏接口对齐</text><text x="165" y="70" text-anchor="middle" font-size="13" fill="#607583">Display-interface datum</text><rect x="55" y="105" width="220" height="155" rx="42" fill="#edf4e4" stroke="#7aa553" stroke-width="4"/><rect x="95" y="140" width="140" height="85" rx="20" fill="#fff" stroke="#7aa553" stroke-width="3"/><path d="M70 242 H260" stroke="#c28b21" stroke-width="10"/><text x="165" y="302" text-anchor="middle" font-size="14" fill="#36596c">观察贴合面与周边关系</text></g>
    <g transform="translate(805 165)"><rect width="330" height="340" rx="6" fill="#f4f7f9" stroke="#98abb7" stroke-width="2"/><text x="165" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#15364b">装配基准对齐</text><text x="165" y="70" text-anchor="middle" font-size="13" fill="#607583">Assembly datum</text><rect x="55" y="105" width="220" height="155" rx="42" fill="#efe7f4" stroke="#9471aa" stroke-width="4"/><circle cx="85" cy="182" r="10" fill="#9471aa"/><circle cx="245" cy="182" r="10" fill="#9471aa"/><circle cx="165" cy="235" r="10" fill="#9471aa"/><text x="165" y="302" text-anchor="middle" font-size="14" fill="#36596c">观察孔位、按键与后盖关系</text></g>
    <rect x="90" y="550" width="1020" height="70" rx="4" fill="#e9eef1"/><text x="600" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#36596c">三种结果回答不同问题，应并列解释而不是挑选最有利的色谱。</text><text x="600" y="600" text-anchor="middle" font-size="13" fill="#607583">Conceptual maps only; colors do not represent measured deviation or acceptance limits.</text>
  </g>
</svg>
