<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b7c7d1" stroke-width="2"/>
  <text x="65" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15364b">夹具漂移还是零件漂移？参考件交叉诊断矩阵</text>
  <text x="65" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607583">Cross-check production parts, a reference artifact and repeated placement before process escalation</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(300 170)" font-size="16" fill="#15364b" text-anchor="middle"><text x="150" y="0">参考件稳定</text><text x="450" y="0">参考件变化</text></g>
    <g transform="translate(95 220)" font-size="16" fill="#15364b"><text x="0" y="85">生产件稳定</text><text x="0" y="275">生产件变化</text></g>
    <g transform="translate(300 200)">
      <rect x="0" y="0" width="300" height="170" fill="#dff0e5" stroke="#7aa98a" stroke-width="2"/><text x="150" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#315c45">系统基线正常</text><text x="150" y="95" text-anchor="middle" font-size="14" fill="#36596c">继续常规监控</text><text x="150" y="122" text-anchor="middle" font-size="13" fill="#607583">System stable</text>
      <rect x="300" y="0" width="300" height="170" fill="#f3d9d6" stroke="#c75e53" stroke-width="2"/><text x="450" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#783c37">优先调查测量系统</text><text x="450" y="95" text-anchor="middle" font-size="14" fill="#36596c">夹具、校准、环境、模板</text><text x="450" y="122" text-anchor="middle" font-size="13" fill="#607583">Measurement system first</text>
      <rect x="0" y="170" width="300" height="170" fill="#fbf1d9" stroke="#c28b21" stroke-width="2"/><text x="150" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#735416">优先调查制造过程</text><text x="150" y="265" text-anchor="middle" font-size="14" fill="#36596c">材料、模具、加工、批次</text><text x="150" y="292" text-anchor="middle" font-size="13" fill="#607583">Production process first</text>
      <rect x="300" y="170" width="300" height="170" fill="#efe7f4" stroke="#9471aa" stroke-width="2"/><text x="450" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#5f4770">暂停放行并分层复核</text><text x="450" y="265" text-anchor="middle" font-size="14" fill="#36596c">系统与过程可能同时变化</text><text x="450" y="292" text-anchor="middle" font-size="13" fill="#607583">Layered investigation</text>
    </g>
    <rect x="90" y="570" width="1020" height="48" rx="4" fill="#e9eef1"/><text x="600" y="599" text-anchor="middle" font-size="13" fill="#607583">“稳定/变化”应依据项目验证规则，不使用本图作为通用阈值 / Use project-qualified rules, not a universal threshold</text>
  </g>
</svg>
