<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Functional feature map for a 3C precision structural component</title>
  <desc id="desc">A device-free inspection diagram showing profile, mounting, sealing, hole, thin-wall, and local curvature regions.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c5360"/>
      <stop offset=".55" stop-color="#35af9d"/>
      <stop offset="1" stop-color="#d8c75d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020a0e" flood-opacity=".5"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dcebee"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#081820"/>
  <g opacity=".12" stroke="#8bc6cf">
    <path d="M0 90H1280M0 180H1280M0 270H1280M0 360H1280M0 450H1280M0 540H1280M0 630H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>
  <text x="64" y="70" fill="#f2fbfc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Functional Feature Map</text>
  <text x="64" y="106" fill="#97bcc4" font-family="Arial, sans-serif" font-size="18">Full-field geometry becomes useful when each region is tied to an engineering decision</text>

  <g filter="url(#shadow)">
    <path d="M276 182Q246 182 232 212L190 510Q186 550 226 560H824Q864 550 860 510L818 212Q804 182 774 182Z" fill="url(#panel)" stroke="#b8f1e6" stroke-width="4"/>
    <path d="M300 222H750Q773 222 778 246L816 490Q820 518 790 522H260Q230 518 234 490L272 246Q277 222 300 222Z" fill="#0d2d38" stroke="#82dccb" stroke-width="3"/>
    <rect x="336" y="270" width="378" height="198" rx="26" fill="#143e48" stroke="#54c5b4" stroke-width="3"/>
    <path d="M378 315H670M378 355H670M378 395H670M378 435H670" stroke="#3a7580" stroke-width="2" stroke-dasharray="7 9"/>
    <circle cx="300" cy="260" r="22" fill="#071820" stroke="#f3cb61" stroke-width="4"/>
    <circle cx="754" cy="260" r="22" fill="#071820" stroke="#f3cb61" stroke-width="4"/>
    <circle cx="286" cy="478" r="20" fill="#071820" stroke="#f3cb61" stroke-width="4"/>
    <circle cx="768" cy="478" r="20" fill="#071820" stroke="#f3cb61" stroke-width="4"/>
    <rect x="460" y="198" width="132" height="24" rx="6" fill="#f09068"/>
    <rect x="426" y="522" width="200" height="20" rx="6" fill="#68d4dc"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g stroke="#dcebee" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M1030 182H824L786 210"/>
      <path d="M1048 286H810L730 310"/>
      <path d="M1042 402H856L780 470"/>
      <path d="M1018 526H834L608 530"/>
      <path d="M170 202H234L300 252"/>
      <path d="M146 348H234L338 366"/>
      <path d="M174 514H226L250 500"/>
    </g>
    <g fill="#f4fbfc" font-size="19" font-weight="700">
      <text x="1042" y="177">Outer profile</text>
      <text x="1060" y="281">Sealing / mating path</text>
      <text x="1054" y="397">Mounting relationship</text>
      <text x="1030" y="521">Edge curvature</text>
      <text x="64" y="197">Hole position</text>
      <text x="64" y="343">Thin-wall form</text>
      <text x="64" y="509">Local transition</text>
    </g>
    <g fill="#9ebfc6" font-size="15">
      <text x="1042" y="202">profile and corner continuity</text>
      <text x="1060" y="306">width, depth, continuity, location</text>
      <text x="1054" y="422">plane, height, hole, datum</text>
      <text x="1030" y="546">sections and radius trend</text>
      <text x="64" y="222">center, axis, local edge quality</text>
      <text x="64" y="368">warpage and surface profile</text>
      <text x="64" y="534">rib, boss, fillet, snap feature</text>
    </g>
  </g>

  <rect x="72" y="628" width="1136" height="52" rx="6" fill="#0d2731" stroke="#355964"/>
  <g font-family="Arial, sans-serif" font-size="16">
    <circle cx="104" cy="654" r="9" fill="#35af9d"/><text x="122" y="660" fill="#cfe3e7">full-field surface</text>
    <circle cx="316" cy="654" r="9" fill="#f3cb61"/><text x="334" y="660" fill="#cfe3e7">hole / locator</text>
    <circle cx="510" cy="654" r="9" fill="#f09068"/><text x="528" y="660" fill="#cfe3e7">critical interface</text>
    <circle cx="738" cy="654" r="9" fill="#68d4dc"/><text x="756" y="660" fill="#cfe3e7">profile / edge</text>
    <text x="934" y="660" fill="#91b7bf">Illustrative data map</text>
  </g>
</svg>
