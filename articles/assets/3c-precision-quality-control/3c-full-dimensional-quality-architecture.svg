<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">3C full-dimensional quality-control architecture</title>
  <desc id="desc">A data workflow connecting product development, manufacturing validation, production quality control, and traceable improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="1" stop-color="#102f3b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28c7d9"/>
      <stop offset="0.52" stop-color="#6de1a7"/>
      <stop offset="1" stop-color="#f3c75c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#73d8d7"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity=".14" stroke="#9de8ef">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>
  <text x="72" y="78" fill="#f4fbfc" font-family="Arial, sans-serif" font-size="34" font-weight="700">3C Full-Dimensional Quality-Control Architecture</text>
  <text x="72" y="114" fill="#9dc4cc" font-family="Arial, sans-serif" font-size="18">One controlled geometry language across development, tooling, production, and traceability</text>

  <g filter="url(#shadow)">
    <rect x="72" y="178" width="250" height="264" rx="8" fill="#0d2632" stroke="#28c7d9" stroke-width="2"/>
    <rect x="370" y="178" width="250" height="264" rx="8" fill="#0d2632" stroke="#6de1a7" stroke-width="2"/>
    <rect x="668" y="178" width="250" height="264" rx="8" fill="#0d2632" stroke="#f3c75c" stroke-width="2"/>
    <rect x="966" y="178" width="242" height="264" rx="8" fill="#0d2632" stroke="#e38f65" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif">
    <circle cx="112" cy="222" r="20" fill="#28c7d9"/><text x="105" y="230" fill="#06202b" font-size="20" font-weight="700">1</text>
    <text x="145" y="230" fill="#ecfbfd" font-size="24" font-weight="700">Development</text>
    <text x="104" y="278" fill="#b8d9df" font-size="18">Physical sample digitization</text>
    <text x="104" y="314" fill="#b8d9df" font-size="18">CAD revision comparison</text>
    <text x="104" y="350" fill="#b8d9df" font-size="18">Interface and profile review</text>
    <rect x="104" y="384" width="178" height="32" rx="4" fill="#133b48"/>
    <text x="123" y="406" fill="#72e1e9" font-size="15" font-weight="700">DESIGN BASELINE</text>

    <circle cx="410" cy="222" r="20" fill="#6de1a7"/><text x="403" y="230" fill="#09271f" font-size="20" font-weight="700">2</text>
    <text x="443" y="230" fill="#ecfbfd" font-size="24" font-weight="700">Manufacturing</text>
    <text x="402" y="278" fill="#b8d9df" font-size="18">Tool and first-article review</text>
    <text x="402" y="314" fill="#b8d9df" font-size="18">Full-field CAD deviation</text>
    <text x="402" y="350" fill="#b8d9df" font-size="18">Process-trial comparison</text>
    <rect x="402" y="384" width="178" height="32" rx="4" fill="#163d35"/>
    <text x="422" y="406" fill="#86edbd" font-size="15" font-weight="700">VALIDATED RECIPE</text>

    <circle cx="708" cy="222" r="20" fill="#f3c75c"/><text x="701" y="230" fill="#2b2206" font-size="20" font-weight="700">3</text>
    <text x="741" y="230" fill="#ecfbfd" font-size="24" font-weight="700">Quality Control</text>
    <text x="700" y="278" fill="#b8d9df" font-size="18">Feature and GD&amp;T checks</text>
    <text x="700" y="314" fill="#b8d9df" font-size="18">Assembly-interface review</text>
    <text x="700" y="350" fill="#b8d9df" font-size="18">Comparable batch reports</text>
    <rect x="700" y="384" width="178" height="32" rx="4" fill="#403617"/>
    <text x="720" y="406" fill="#f7d77f" font-size="15" font-weight="700">DECISION EVIDENCE</text>

    <circle cx="1006" cy="222" r="20" fill="#e38f65"/><text x="999" y="230" fill="#2a1209" font-size="20" font-weight="700">4</text>
    <text x="1039" y="230" fill="#ecfbfd" font-size="24" font-weight="700">Traceability</text>
    <text x="998" y="278" fill="#b8d9df" font-size="18">Part and batch identity</text>
    <text x="998" y="314" fill="#b8d9df" font-size="18">Revision-controlled archive</text>
    <text x="998" y="350" fill="#b8d9df" font-size="18">Trend and change review</text>
    <rect x="998" y="384" width="174" height="32" rx="4" fill="#432b24"/>
    <text x="1018" y="406" fill="#f2aa87" font-size="15" font-weight="700">QUALITY MEMORY</text>
  </g>

  <g stroke="#73d8d7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M322 310H354"/>
    <path d="M620 310H652"/>
    <path d="M918 310H950"/>
  </g>

  <rect x="72" y="504" width="1136" height="126" rx="8" fill="#0b202a" stroke="#37616c"/>
  <rect x="72" y="504" width="1136" height="8" rx="4" fill="url(#flow)"/>
  <text x="104" y="552" fill="#f4fbfc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Shared inspection language</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#b8d9df">
    <text x="104" y="594">CAD / PMI</text>
    <text x="252" y="594">Part state</text>
    <text x="390" y="594">Fixture</text>
    <text x="506" y="594">Coverage</text>
    <text x="648" y="594">Alignment</text>
    <text x="800" y="594">Features</text>
    <text x="930" y="594">Decision</text>
    <text x="1066" y="594">Archive</text>
  </g>
</svg>
