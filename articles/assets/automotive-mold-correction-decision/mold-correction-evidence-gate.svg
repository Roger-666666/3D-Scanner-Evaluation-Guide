<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Automotive mold correction evidence gate</title><desc id="desc">Conceptual decision gates separating observed deviation from an approved mold correction.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526878"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.e{font-size:13px;fill:#506979}.ln{stroke:#526878;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">从偏差到修模：必须连续通过五道证据门</text><text x="78" y="130" class="t s">A deviation becomes a correction candidate only after five evidence gates</text><g class="t"><rect x="75" y="225" width="175" height="120" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="162" y="260" text-anchor="middle" class="k">数据可信</text><text x="162" y="286" text-anchor="middle" class="e">覆盖、拼接、边界</text><text x="162" y="309" text-anchor="middle" class="e">重复扫描与复算</text><rect x="290" y="225" width="175" height="120" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="377" y="260" text-anchor="middle" class="k">模式稳定</text><text x="377" y="286" text-anchor="middle" class="e">位置、方向、批次</text><text x="377" y="309" text-anchor="middle" class="e">对齐敏感性</text><rect x="505" y="225" width="175" height="120" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="592" y="260" text-anchor="middle" class="k">来源相关</text><text x="592" y="286" text-anchor="middle" class="e">模具、试模件、工艺</text><text x="592" y="309" text-anchor="middle" class="e">空间传递关系</text><rect x="720" y="225" width="175" height="120" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="807" y="260" text-anchor="middle" class="k">风险受控</text><text x="807" y="286" text-anchor="middle" class="e">目标区、保护区</text><text x="807" y="309" text-anchor="middle" class="e">副作用与回滚</text><rect x="935" y="225" width="190" height="120" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="1030" y="260" text-anchor="middle" class="k">批准修模</text><text x="1030" y="286" text-anchor="middle" class="e">版本、责任、复验</text><text x="1030" y="309" text-anchor="middle" class="e">Approved action</text></g><path d="M250 285H280M465 285H495M680 285H710M895 285H925" class="ln"/><g class="t"><rect x="100" y="420" width="450" height="82" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="325" y="451" text-anchor="middle" class="k">任一证据门未通过：停止直接修模</text><text x="325" y="478" text-anchor="middle" class="e">转入复扫、参考测量、工艺复核或更多样件调查</text><rect x="650" y="420" width="450" height="82" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="875" y="451" text-anchor="middle" class="k">全部通过：形成最小化修模候选</text><text x="875" y="478" text-anchor="middle" class="e">修模量仍由批准的工程流程决定</text></g><rect x="115" y="565" width="970" height="40" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="591" text-anchor="middle" class="t e">示意流程不代表自动放行规则 / Conceptual workflow; no automatic correction authority implied</text></svg>

