<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Mold correction knowledge loop</title><desc id="desc">Conceptual loop turning each mold correction into reusable evidence instead of undocumented experience.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526878"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.e{font-size:13px;fill:#506979}.ln{stroke:#526878;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">修模知识闭环：保存“为什么改、改了什么、结果如何”</text><text x="78" y="130" class="t s">Convert correction history into reusable, reviewable evidence</text><g class="t"><rect x="110" y="210" width="220" height="95" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="220" y="245" text-anchor="middle" class="k">异常模式</text><text x="220" y="272" text-anchor="middle" class="e">对象、状态、空间指纹</text><rect x="490" y="175" width="220" height="95" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="600" y="210" text-anchor="middle" class="k">归因假设</text><text x="600" y="237" text-anchor="middle" class="e">支持证据与反证</text><rect x="870" y="210" width="220" height="95" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="980" y="245" text-anchor="middle" class="k">批准动作</text><text x="980" y="272" text-anchor="middle" class="e">目标区、版本与责任</text><rect x="870" y="405" width="220" height="95" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="980" y="440" text-anchor="middle" class="k">修后响应</text><text x="980" y="467" text-anchor="middle" class="e">目标、保护与功能结果</text><rect x="490" y="440" width="220" height="95" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="600" y="475" text-anchor="middle" class="k">规则更新</text><text x="600" y="502" text-anchor="middle" class="e">保留适用条件与边界</text><rect x="110" y="405" width="220" height="95" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="220" y="440" text-anchor="middle" class="k">复用或否定</text><text x="220" y="467" text-anchor="middle" class="e">新项目先验证，不照搬</text></g><path d="M330 255L480 225M710 225L860 255M980 305V395M870 452L720 485M490 485L340 452M220 405V315" class="ln"/><rect x="270" y="330" width="660" height="58" rx="6" fill="#fff" stroke="#c4d0d8"/><text x="600" y="355" text-anchor="middle" class="t k">可检索字段：车型、模具、型穴、区域、模式、假设、动作、响应、结论边界</text><text x="600" y="378" text-anchor="middle" class="t e">Searchable fields make experience auditable without turning correlation into universal causation</text><text x="600" y="598" text-anchor="middle" class="t e">知识库用于缩短调查路径，不替代当前项目的验证 / Reuse requires current-project validation</text></svg>

