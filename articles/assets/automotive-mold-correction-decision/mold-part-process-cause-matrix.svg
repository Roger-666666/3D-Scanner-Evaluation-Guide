<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Mold part process cause matrix</title><desc id="desc">Conceptual matrix for separating mold geometry, trial part response and process state evidence.</desc><defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.c{stroke:#b8c5ce;stroke-width:1.5}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">模具、试模件、工艺三层归因矩阵</text><text x="78" y="130" class="t s">Cross-object evidence prevents a molded-part defect from becoming an automatic mold diagnosis</text><g transform="translate(80 185)" class="t"><rect x="0" y="0" width="210" height="58" fill="#edf1f3" class="c"/><text x="105" y="35" text-anchor="middle" class="b">空间模式</text><rect x="210" y="0" width="170" height="58" fill="#d8edf7" class="c"/><text x="295" y="35" text-anchor="middle" class="b">模具表面</text><rect x="380" y="0" width="170" height="58" fill="#f6e8bc" class="c"/><text x="465" y="35" text-anchor="middle" class="b">试模件</text><rect x="550" y="0" width="170" height="58" fill="#e7dfee" class="c"/><text x="635" y="35" text-anchor="middle" class="b">工艺记录</text><g class="b"><rect x="0" y="58" width="210" height="66" fill="#fbfcfd" class="c"/><text x="105" y="97" text-anchor="middle">同位置同方向</text><rect x="0" y="124" width="210" height="66" fill="#fbfcfd" class="c"/><text x="105" y="163" text-anchor="middle">零件变化、模具稳定</text><rect x="0" y="190" width="210" height="66" fill="#fbfcfd" class="c"/><text x="105" y="229" text-anchor="middle">模具变化、零件不响应</text><rect x="0" y="256" width="210" height="66" fill="#fbfcfd" class="c"/><text x="105" y="295" text-anchor="middle">异常随复扫移动</text></g><g class="c"><rect x="210" y="58" width="170" height="66" fill="#f2d8d6"/><rect x="380" y="58" width="170" height="66" fill="#f2d8d6"/><rect x="550" y="58" width="170" height="66" fill="#dceacb"/><rect x="210" y="124" width="170" height="66" fill="#dceacb"/><rect x="380" y="124" width="170" height="66" fill="#f6e8bc"/><rect x="550" y="124" width="170" height="66" fill="#e7dfee"/><rect x="210" y="190" width="170" height="66" fill="#f6e8bc"/><rect x="380" y="190" width="170" height="66" fill="#dceacb"/><rect x="550" y="190" width="170" height="66" fill="#d8edf7"/><rect x="210" y="256" width="170" height="66" fill="#d8edf7"/><rect x="380" y="256" width="170" height="66" fill="#d8edf7"/><rect x="550" y="256" width="170" height="66" fill="#edf1f3"/></g></g><g class="t"><rect x="850" y="190" width="270" height="70" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="875" y="220" class="k">相关性增强</text><text x="875" y="244" class="e">同空间、同方向、可重复传递</text><rect x="850" y="278" width="270" height="70" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="875" y="308" class="k">工艺优先</text><text x="875" y="332" class="e">零件变、模具稳、状态相关</text><rect x="850" y="366" width="270" height="70" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="875" y="396" class="k">测量优先</text><text x="875" y="420" class="e">异常随覆盖或复扫移动</text><rect x="850" y="454" width="270" height="70" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="875" y="484" class="k">继续调查</text><text x="875" y="508" class="e">证据冲突时不得强行归因</text></g><text x="600" y="600" text-anchor="middle" class="t e">颜色仅表示概念证据状态，不表示公差或因果概率 / Conceptual evidence states only</text></svg>

