<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Rollback baseline version chain</title><desc id="desc">Conceptual configuration chain linking approved baseline, change hypothesis, corrected version, verification and rollback.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526878"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.e{font-size:13px;fill:#506979}.ln{stroke:#526878;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">修模版本链：每次改动都必须知道从哪里来、如何回去</text><text x="78" y="130" class="t s">A controlled baseline makes correction reversible and reviewable</text><g class="t"><rect x="80" y="215" width="190" height="110" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="175" y="250" text-anchor="middle" class="k">批准基线 V0</text><text x="175" y="277" text-anchor="middle" class="e">CAD、实物、模板</text><text x="175" y="300" text-anchor="middle" class="e">Approved baseline</text><rect x="315" y="215" width="190" height="110" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="410" y="250" text-anchor="middle" class="k">变更假设 H1</text><text x="410" y="277" text-anchor="middle" class="e">目标区、方向、风险</text><text x="410" y="300" text-anchor="middle" class="e">Change hypothesis</text><rect x="550" y="215" width="190" height="110" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="645" y="250" text-anchor="middle" class="k">修模版本 V1</text><text x="645" y="277" text-anchor="middle" class="e">加工记录、责任、时间</text><text x="645" y="300" text-anchor="middle" class="e">Corrected state</text><rect x="785" y="215" width="190" height="110" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="880" y="250" text-anchor="middle" class="k">复验 R1</text><text x="880" y="277" text-anchor="middle" class="e">目标、保护、装配</text><text x="880" y="300" text-anchor="middle" class="e">Verification</text></g><path d="M270 270H305M505 270H540M740 270H775" class="ln"/><g class="t"><rect x="785" y="405" width="190" height="95" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="880" y="441" text-anchor="middle" class="k">接受 V1</text><text x="880" y="468" text-anchor="middle" class="e">形成新批准基线</text><rect x="315" y="405" width="425" height="95" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="527" y="441" text-anchor="middle" class="k">响应不符或出现副作用</text><text x="527" y="468" text-anchor="middle" class="e">冻结V1，回到V0证据与假设重新评审</text></g><path d="M880 325V395M785 453H750M315 453H175V335" class="ln"/><rect x="115" y="555" width="970" height="42" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="582" text-anchor="middle" class="t e">回滚是证据与版本恢复能力，不代表所有实体加工都可逆 / Rollback means controlled evidence and decision recovery</text></svg>

