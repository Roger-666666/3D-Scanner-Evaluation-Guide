<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Before after holdout difference</title><desc id="desc">Conceptual before and after validation showing target response, protected holdout features and unintended change.</desc><defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.e{font-size:13px;fill:#506979}.grid{stroke:#d9e1e6;stroke-width:1}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">修模后不是“更绿就好”：目标响应与留出特征必须同时成立</text><text x="78" y="130" class="t s">Validate intended response and protected holdout features in the same comparison</text><g class="t"><rect x="80" y="190" width="470" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="315" y="225" text-anchor="middle" class="k">修模前 / Before</text><g class="grid"><path d="M120 265H510M120 320H510M120 375H510M120 430H510"/><path d="M185 250V455M250 250V455M315 250V455M380 250V455M445 250V455"/></g><path d="M125 405Q225 270 330 365T505 295" fill="none" stroke="#d05f4f" stroke-width="7"/><rect x="250" y="255" width="130" height="190" fill="none" stroke="#b85a50" stroke-width="4" stroke-dasharray="8 6"/><text x="315" y="472" text-anchor="middle" class="e">目标区与保护特征基线</text><rect x="650" y="190" width="470" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="885" y="225" text-anchor="middle" class="k">修模后 / After</text><g class="grid"><path d="M690 265H1080M690 320H1080M690 375H1080M690 430H1080"/><path d="M755 250V455M820 250V455M885 250V455M950 250V455M1015 250V455"/></g><path d="M695 400Q795 315 900 360T1075 300" fill="none" stroke="#2e8b72" stroke-width="7"/><rect x="820" y="255" width="130" height="190" fill="none" stroke="#6d9147" stroke-width="4" stroke-dasharray="8 6"/><text x="885" y="472" text-anchor="middle" class="e">目标区改善，留出特征保持</text></g><g class="t"><rect x="120" y="535" width="300" height="55" rx="5" fill="#dceacb" stroke="#6d9147"/><text x="270" y="568" text-anchor="middle" class="e">目标响应符合预期方向</text><rect x="450" y="535" width="300" height="55" rx="5" fill="#d8edf7" stroke="#4f8daf"/><text x="600" y="568" text-anchor="middle" class="e">保护区与接口没有非预期变化</text><rect x="780" y="535" width="300" height="55" rx="5" fill="#f6e8bc" stroke="#b58a25"/><text x="930" y="568" text-anchor="middle" class="e">相同状态、对齐、模板和覆盖</text></g></svg>

