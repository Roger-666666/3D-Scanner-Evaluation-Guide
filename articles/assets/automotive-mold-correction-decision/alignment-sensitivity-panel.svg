<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Alignment sensitivity panel</title><desc id="desc">Conceptual comparison of global best fit, functional datum alignment and local feature alignment.</desc><defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.ref{stroke:#7c8f9d;stroke-width:3;stroke-dasharray:8 6;fill:none}.m{stroke:#2d789f;stroke-width:7;fill:none}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">同一份扫描数据，三种对齐回答三种问题</text><text x="78" y="130" class="t s">Alignment sensitivity reveals whether a repair signal is functional, local or coordinate-dependent</text><g transform="translate(70 190)" class="t"><rect width="320" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="160" y="38" text-anchor="middle" class="k">整体最佳拟合</text><text x="160" y="62" text-anchor="middle" class="e">Global best fit</text><path d="M45 215Q145 95 275 185" class="ref"/><path d="M45 198Q145 118 275 172" class="m"/><ellipse cx="228" cy="169" rx="35" ry="22" fill="#f2d8d6" opacity=".9"/><text x="160" y="264" text-anchor="middle" class="b">看整体形状与覆盖</text><rect x="360" width="320" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="520" y="38" text-anchor="middle" class="k">功能基准对齐</text><text x="520" y="62" text-anchor="middle" class="e">Functional datum</text><path d="M405 215Q505 95 635 185" class="ref"/><path d="M405 215Q505 125 635 177" class="m"/><ellipse cx="583" cy="174" rx="37" ry="22" fill="#f6e8bc" opacity=".95"/><text x="520" y="264" text-anchor="middle" class="b">看装配与定位关系</text><rect x="720" width="320" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="880" y="38" text-anchor="middle" class="k">局部特征对齐</text><text x="880" y="62" text-anchor="middle" class="e">Local feature fit</text><path d="M765 215Q865 95 995 185" class="ref"/><path d="M765 221Q865 102 995 194" class="m"/><ellipse cx="925" cy="178" rx="38" ry="23" fill="#e7dfee" opacity=".95"/><text x="880" y="264" text-anchor="middle" class="b">看局部形状，不作整模放行</text></g><g class="t"><rect x="115" y="530" width="450" height="58" rx="5" fill="#dceacb" stroke="#6d9147"/><text x="340" y="565" text-anchor="middle" class="b">多种合理对齐下同位置稳定：工程调查优先级上升</text><rect x="635" y="530" width="450" height="58" rx="5" fill="#d8edf7" stroke="#4f8daf"/><text x="860" y="565" text-anchor="middle" class="b">异常随对齐明显移动：先复核坐标与基准，不直接修模</text></g></svg>

