<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Minimum mold correction zone map</title><desc id="desc">Conceptual map dividing target, protection, verification and unevaluable zones for minimal mold intervention.</desc><defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.e{font-size:13px;fill:#506979}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">最小修模范围：目标区之外，还要明确保护区与复验区</text><text x="78" y="130" class="t s">A correction map needs target, protection, verification and unevaluable zones</text><g transform="translate(70 175)"><path d="M70 320L115 85H455L525 205L430 390H135Z" fill="#d8edf7" stroke="#4f8daf" stroke-width="4"/><path d="M180 115H395L448 205L390 340H175L125 285Z" fill="#dceacb" stroke="#6d9147" stroke-width="4"/><ellipse cx="305" cy="230" rx="88" ry="62" fill="#f2d8d6" stroke="#b85a50" stroke-width="5"/><path d="M110 95L175 115L125 285L70 320Z" fill="#e7dfee" stroke="#8b70a7" stroke-width="4"/><path d="M455 85L525 205L430 390L390 340L448 205L395 115Z" fill="#edf1f3" stroke="#899ba7" stroke-width="4" stroke-dasharray="8 6"/><text x="300" y="445" text-anchor="middle" class="t e">概念型面分区 / Conceptual surface zoning</text></g><g class="t"><rect x="700" y="180" width="400" height="72" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="725" y="210" class="k">目标区 / Target</text><text x="725" y="235" class="e">计划修正且有稳定证据支持的区域</text><rect x="700" y="270" width="400" height="72" rx="6" fill="#dceacb" stroke="#6d9147"/><text x="725" y="300" class="k">保护区 / Protection</text><text x="725" y="325" class="e">功能关键但不应随本次修正改变</text><rect x="700" y="360" width="400" height="72" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="725" y="390" class="k">复验区 / Verification</text><text x="725" y="415" class="e">用于观察偏差传播与接口副作用</text><rect x="700" y="450" width="400" height="72" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="725" y="480" class="k">不可评价区 / Unevaluable</text><text x="725" y="505" class="e">覆盖不足，不得作为修模边界依据</text></g><rect x="115" y="570" width="970" height="38" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="595" text-anchor="middle" class="t e">分区颜色仅作方法说明，不代表实测偏差 / Colors explain method only</text></svg>

