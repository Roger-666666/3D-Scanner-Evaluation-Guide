<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Deviation pattern classifier</title><desc id="desc">Conceptual classes for global, local, boundary, transfer and data-quality deviation patterns.</desc><defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.e{font-size:13px;fill:#506979}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">全域偏差模式分类：颜色相同，调查路径可能完全不同</text><text x="78" y="130" class="t s">Classify spatial structure before assigning a mold cause</text><g class="t"><rect x="75" y="185" width="330" height="150" rx="6" fill="#d8edf7" stroke="#4f8daf"/><text x="100" y="222" class="k">整体模式 / Global</text><path d="M110 290Q215 205 365 276" fill="none" stroke="#2d789f" stroke-width="12"/><text x="100" y="316" class="e">大范围同向变化：基准、整体变形、过程状态</text><rect x="435" y="185" width="330" height="150" rx="6" fill="#f2d8d6" stroke="#b85a50"/><text x="460" y="222" class="k">局部模式 / Local</text><path d="M470 285Q570 230 720 280" fill="none" stroke="#617a89" stroke-width="10"/><ellipse cx="625" cy="259" rx="36" ry="22" fill="#d05f4f"/><text x="460" y="316" class="e">固定局部：镶件、刀路、磨损、修补区</text><rect x="795" y="185" width="330" height="150" rx="6" fill="#f6e8bc" stroke="#b58a25"/><text x="820" y="222" class="k">边界模式 / Boundary</text><path d="M830 288H1088" stroke="#c58a2a" stroke-width="12"/><path d="M890 250V315M1030 250V315" stroke="#7f91a0" stroke-width="4"/><text x="820" y="316" class="e">分型、切边、孔边：先审核覆盖与提取</text><rect x="250" y="380" width="330" height="150" rx="6" fill="#e7dfee" stroke="#8b70a7"/><text x="275" y="417" class="k">传递模式 / Transfer</text><circle cx="335" cy="470" r="36" fill="#8b70a7" opacity=".8"/><path d="M390 470H465" stroke="#536879" stroke-width="4"/><circle cx="515" cy="470" r="36" fill="#8b70a7" opacity=".45"/><text x="275" y="511" class="e">模具与试模件同空间响应：相关性增强</text><rect x="620" y="380" width="330" height="150" rx="6" fill="#edf1f3" stroke="#899ba7"/><text x="645" y="417" class="k">数据模式 / Data quality</text><path d="M660 485L705 440L750 492L795 435L845 485L900 450" fill="none" stroke="#617a89" stroke-width="5" stroke-dasharray="8 6"/><text x="645" y="511" class="e">随视角、拼接、补洞或对齐移动：先复测</text></g><text x="600" y="600" text-anchor="middle" class="t e">模式决定下一条证据，不自动决定修模 / Patterns route investigation; they do not authorize correction</text></svg>

