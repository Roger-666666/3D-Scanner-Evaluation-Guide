<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cross-object deviation transfer map</title><desc id="desc">Conceptual spatial transfer map between mold, trial part and assembly interface.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526878"/></marker><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173044}.h{font-size:30px;font-weight:700}.s{font-size:16px;fill:#577080}.k{font-size:18px;font-weight:700}.b{font-size:14px}.e{font-size:13px;fill:#506979}.ln{stroke:#526878;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="680" fill="#f3f6f8"/><rect x="38" y="38" width="1124" height="604" rx="8" fill="#fff" stroke="#bdcbd5" stroke-width="2"/><text x="78" y="96" class="t h">跨对象偏差传递图：形似不等于同因，位置关系才是线索</text><text x="78" y="130" class="t s">Compare spatial signatures across mold, trial part and assembly interface</text><g class="t"><rect x="75" y="190" width="290" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="220" y="226" text-anchor="middle" class="k">模具 / Mold</text><path d="M120 410Q205 245 315 355" fill="none" stroke="#517487" stroke-width="16"/><ellipse cx="230" cy="322" rx="46" ry="28" fill="#f2d8d6" stroke="#b85a50" stroke-width="3"/><text x="220" y="458" text-anchor="middle" class="e">型面、镶件、分型与局部磨损</text><rect x="455" y="190" width="290" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="600" y="226" text-anchor="middle" class="k">试模件 / Trial part</text><path d="M500 395Q590 265 705 365" fill="none" stroke="#2e8b72" stroke-width="14"/><ellipse cx="615" cy="326" rx="54" ry="31" fill="#f6e8bc" stroke="#b58a25" stroke-width="3"/><text x="600" y="458" text-anchor="middle" class="e">脱模、收缩、翘曲与后处理状态</text><rect x="835" y="190" width="290" height="300" rx="6" fill="#fbfcfd" stroke="#c4d0d8"/><text x="980" y="226" text-anchor="middle" class="k">装配接口 / Assembly</text><path d="M875 380Q965 285 1080 350" fill="none" stroke="#8b70a7" stroke-width="14"/><ellipse cx="994" cy="327" rx="58" ry="30" fill="#e7dfee" stroke="#8b70a7" stroke-width="3"/><text x="980" y="458" text-anchor="middle" class="e">间隙、面差、孔位与接触关系</text></g><path d="M365 340H445M745 340H825" class="ln"/><g class="t e"><text x="405" y="320" text-anchor="middle">方向是否对应</text><text x="785" y="320" text-anchor="middle">功能是否传递</text></g><rect x="125" y="535" width="950" height="50" rx="5" fill="#edf1f3" stroke="#c6d0d7"/><text x="600" y="566" text-anchor="middle" class="t e">仅当模式在受控状态中稳定传递，模具因素才获得更高调查优先级 / Stable transfer raises priority; it does not prove causation</text></svg>

