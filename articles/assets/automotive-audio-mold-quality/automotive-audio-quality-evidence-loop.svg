<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">汽车音响模具到声学验证的质量证据闭环</title>
  <desc id="desc">展示设计与模具几何、成型片几何、装配状态和声学试验之间的受控关联。几何证据、过程证据和声学证据使用不同颜色，强调三维扫描不能独立判定音色失真的根因。</desc>
  <rect width="1200" height="720" fill="#f5f7f8"/>
  <rect x="40" y="40" width="1120" height="640" rx="8" fill="#ffffff" stroke="#c7d0d9" stroke-width="2"/>
  <text x="80" y="95" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#16222c">从模具型面到声学验证：证据闭环</text>
  <text x="80" y="128" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#54626f">Geometry narrows the search; controlled acoustic tests confirm performance</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52636e"/>
    </marker>
  </defs>

  <g fill="none" stroke="#52636e" stroke-width="3" marker-end="url(#arr)">
    <path d="M260 235 L430 235"/>
    <path d="M620 235 L790 235"/>
    <path d="M885 290 L885 415"/>
    <path d="M790 470 L620 470"/>
    <path d="M430 470 L260 470"/>
    <path d="M165 415 L165 290"/>
  </g>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g transform="translate(70 180)">
      <rect width="190" height="110" rx="6" fill="#d9edf3" stroke="#2b7796" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#183c4b">设计基准</text>
      <text x="95" y="70" text-anchor="middle" font-size="15" fill="#355866">CAD / 功能分区</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#355866">Geometry evidence</text>
    </g>
    <g transform="translate(430 180)">
      <rect width="190" height="110" rx="6" fill="#d9edf3" stroke="#2b7796" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#183c4b">模具型面</text>
      <text x="95" y="70" text-anchor="middle" font-size="15" fill="#355866">轮廓 / 边界 / 局部特征</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#355866">Geometry evidence</text>
    </g>
    <g transform="translate(790 180)">
      <rect width="190" height="110" rx="6" fill="#e5efc9" stroke="#6e8b36" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#35451c">受控成型</text>
      <text x="95" y="70" text-anchor="middle" font-size="15" fill="#56672f">材料 / 工艺 / 批次身份</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#56672f">Process evidence</text>
    </g>
    <g transform="translate(790 415)">
      <rect width="190" height="110" rx="6" fill="#d9edf3" stroke="#2b7796" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#183c4b">成型片几何</text>
      <text x="95" y="70" text-anchor="middle" font-size="15" fill="#355866">型面 / 厚度条件 / 边缘</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#355866">Geometry evidence</text>
    </g>
    <g transform="translate(430 415)">
      <rect width="190" height="110" rx="6" fill="#e5efc9" stroke="#6e8b36" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#35451c">受控装配</text>
      <text x="95" y="70" text-anchor="middle" font-size="15" fill="#56672f">张力 / 胶接 / 同轴关系</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#56672f">Process evidence</text>
    </g>
    <g transform="translate(70 415)">
      <rect width="190" height="110" rx="6" fill="#f2dfd8" stroke="#b6583e" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#603025">声学验证</text>
      <text x="95" y="70" text-anchor="middle" font-size="15" fill="#7b4638">频响 / 失真 / 主观评价</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#7b4638">Acoustic evidence</text>
    </g>
  </g>

  <rect x="335" y="326" width="380" height="74" rx="6" fill="#f1f4f5" stroke="#aab5bc"/>
  <text x="525" y="356" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#283843">统一样件身份 + 统一版本 + 可复查记录</text>
  <text x="525" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d6a73">Shared identity, version and reviewable records</text>

  <g transform="translate(1000 210)" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">
    <rect width="120" height="170" rx="5" fill="#f7f9fa" stroke="#cbd4db"/>
    <rect x="15" y="20" width="18" height="18" fill="#d9edf3" stroke="#2b7796"/><text x="43" y="34" fill="#44545f">几何证据</text>
    <rect x="15" y="64" width="18" height="18" fill="#e5efc9" stroke="#6e8b36"/><text x="43" y="78" fill="#44545f">过程证据</text>
    <rect x="15" y="108" width="18" height="18" fill="#f2dfd8" stroke="#b6583e"/><text x="43" y="122" fill="#44545f">声学证据</text>
    <text x="15" y="154" fill="#7a4140">不可互相替代</text>
  </g>
  <text x="80" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#687681">流程示意，不代表单一因素与音色失真之间存在确定因果 / Conceptual workflow; no single-factor causation is implied</text>
</svg>
