<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">扬声器振膜成型片双面厚度与型面分析示意</title>
  <desc id="desc">展示单面扫描只能评价可见型面，可靠双面数据在共同覆盖和受控配准条件下才能形成厚度结果。色带为分析逻辑示意，不是实测数据。</desc>
  <rect width="1200" height="720" fill="#f4f6f7"/>
  <rect x="40" y="40" width="1120" height="640" rx="8" fill="#ffffff" stroke="#c7d0d9" stroke-width="2"/>
  <text x="80" y="95" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#16222c">型面与厚度不是同一个测量问题</text>
  <text x="80" y="128" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#54626f">Form analysis versus two-sided thickness analysis</text>

  <g transform="translate(90 180)">
    <rect width="470" height="410" rx="6" fill="#f8fafb" stroke="#cbd4db"/>
    <text x="28" y="42" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#283b49">A. 单面可见型面</text>
    <text x="28" y="70" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#65727c">Single visible surface</text>
    <path d="M45 270 C105 268,120 152,190 160 C250 167,250 225,300 218 C355 209,370 122,430 126" fill="none" stroke="#227ca6" stroke-width="8"/>
    <path d="M45 285 C105 283,120 167,190 175 C250 182,250 240,300 233 C355 224,370 137,430 141" fill="none" stroke="#b9c4ca" stroke-width="3" stroke-dasharray="8 7"/>
    <g stroke="#c84630" stroke-width="2">
      <line x1="125" y1="162" x2="125" y2="278"/><line x1="355" y1="141" x2="355" y2="217"/>
    </g>
    <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#44545f">
      <text x="42" y="325">可回答：</text>
      <text x="42" y="352">曲面轮廓、边界、局部波纹、CAD 偏差</text>
      <text x="42" y="382" fill="#a44132">不能由单面数据直接推断真实厚度</text>
    </g>
  </g>

  <g transform="translate(640 180)">
    <rect width="470" height="410" rx="6" fill="#f8fafb" stroke="#cbd4db"/>
    <text x="28" y="42" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#283b49">B. 双面共同覆盖</text>
    <text x="28" y="70" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#65727c">Registered opposing surfaces</text>
    <path d="M45 238 C105 236,120 120,190 128 C250 135,250 193,300 186 C355 177,370 90,430 94" fill="none" stroke="#227ca6" stroke-width="7"/>
    <path d="M45 278 C105 276,120 160,190 168 C250 175,250 233,300 226 C355 217,370 130,430 134" fill="none" stroke="#d19b37" stroke-width="7"/>
    <g stroke="#44616f" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)">
      <line x1="125" y1="132" x2="125" y2="160"/>
      <line x1="250" y1="174" x2="250" y2="213"/>
      <line x1="372" y1="110" x2="372" y2="130"/>
    </g>
    <text x="136" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#344450">t(s)</text>
    <rect x="45" y="310" width="385" height="30" rx="4" fill="#dcefb8"/>
    <rect x="45" y="310" width="62" height="30" rx="4" fill="#d4dce1"/>
    <rect x="375" y="310" width="55" height="30" rx="4" fill="#d4dce1"/>
    <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#44545f">
      <text x="45" y="370">成立条件：</text>
      <text x="45" y="397">两侧表面均被可靠采集、坐标关系受控、</text>
      <text x="45" y="424">边缘与遮挡区单独标记，不以补洞代替测量</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44616f"/>
    </marker>
  </defs>
  <g transform="translate(90 620)" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#227ca6" stroke-width="7"/><text x="50" y="5" fill="#50606b">正面可见表面</text>
    <line x1="190" y1="0" x2="228" y2="0" stroke="#d19b37" stroke-width="7"/><text x="240" y="5" fill="#50606b">背面可见表面</text>
    <rect x="405" y="-10" width="38" height="20" fill="#dcefb8"/><text x="455" y="5" fill="#50606b">可评价厚度的共同覆盖区</text>
    <rect x="720" y="-10" width="38" height="20" fill="#d4dce1"/><text x="770" y="5" fill="#50606b">需复核区域</text>
  </g>
  <text x="80" y="660" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#687681">逻辑示意，非实测截面或公差带 / Conceptual logic, not a measured section or tolerance band</text>
</svg>
