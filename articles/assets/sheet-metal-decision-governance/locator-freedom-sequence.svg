<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/>
  <rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">定位自由度阶梯：每增加一个约束，都要观察几何如何响应</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">A locator sequence reveals when assembly fit is achieved by intended location or forced deformation</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect x="90" y="420" width="220" height="120" rx="6" fill="#d8edf7" stroke="#4c96b8"/>
    <rect x="330" y="340" width="220" height="200" rx="6" fill="#e4f0d6" stroke="#79a653"/>
    <rect x="570" y="260" width="220" height="280" rx="6" fill="#f7e8b9" stroke="#c28a1b"/>
    <rect x="810" y="180" width="300" height="360" rx="6" fill="#eadff1" stroke="#9270a8"/>
    <g text-anchor="middle" fill="#17344a">
      <text x="200" y="458" font-size="20" font-weight="700">自由态</text><text x="200" y="487" font-size="14">Free state</text><text x="200" y="516" font-size="13">观察自然形态</text>
      <text x="440" y="378" font-size="20" font-weight="700">主定位</text><text x="440" y="407" font-size="14">Primary location</text><text x="440" y="436" font-size="13">建立支撑与姿态</text>
      <text x="680" y="298" font-size="20" font-weight="700">次定位</text><text x="680" y="327" font-size="14">Secondary location</text><text x="680" y="356" font-size="13">限制侧向自由度</text>
      <text x="960" y="218" font-size="20" font-weight="700">夹紧与连接态</text><text x="960" y="247" font-size="14">Clamped and joined state</text><text x="960" y="276" font-size="13">验证最终接口与副作用</text>
    </g>
    <polyline points="140,394 380,314 620,234 860,154" fill="none" stroke="#c75b50" stroke-width="5" stroke-dasharray="12 8"/>
    <g fill="#c75b50"><circle cx="140" cy="394" r="9"/><circle cx="380" cy="314" r="9"/><circle cx="620" cy="234" r="9"/><circle cx="860" cy="154" r="9"/></g>
    <text x="1080" y="151" text-anchor="end" font-size="14" font-weight="700" fill="#c75b50">记录形态变化，不把夹紧后贴合视为自然合格</text>
    <rect x="90" y="579" width="1020" height="34" rx="4" fill="#edf1f3"/><text x="600" y="601" text-anchor="middle" font-size="13" fill="#607483">阶梯高度仅表示约束增加，不代表力或位移数值 / Step height represents added constraint only</text>
  </g>
</svg>

