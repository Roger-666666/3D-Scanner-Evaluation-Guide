<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/>
  <rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">基准转移链：每次定位都可能重新分配偏差</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">Datum handoffs across design, die, gauge and assembly can change the meaning of the same deviation</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a7385"/></marker></defs>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g fill="#17344a" font-weight="700" font-size="18" text-anchor="middle">
      <rect x="68" y="218" width="190" height="112" rx="6" fill="#d8edf7" stroke="#4c96b8"/><text x="163" y="259">设计基准</text><text x="163" y="288" font-size="14" font-weight="400">Design datums</text>
      <rect x="286" y="218" width="190" height="112" rx="6" fill="#e4f0d6" stroke="#79a653"/><text x="381" y="259">模具定位</text><text x="381" y="288" font-size="14" font-weight="400">Die locating</text>
      <rect x="504" y="218" width="190" height="112" rx="6" fill="#f7e8b9" stroke="#c28a1b"/><text x="599" y="259">检具定位</text><text x="599" y="288" font-size="14" font-weight="400">Gauge locating</text>
      <rect x="722" y="218" width="190" height="112" rx="6" fill="#eadff1" stroke="#9270a8"/><text x="817" y="259">焊装定位</text><text x="817" y="288" font-size="14" font-weight="400">Joining fixture</text>
      <rect x="940" y="218" width="190" height="112" rx="6" fill="#f3d9d6" stroke="#c75b50"/><text x="1035" y="259">整车接口</text><text x="1035" y="288" font-size="14" font-weight="400">Vehicle interface</text>
    </g>
    <line x1="258" y1="274" x2="280" y2="274" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="476" y1="274" x2="498" y2="274" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="694" y1="274" x2="716" y2="274" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="912" y1="274" x2="934" y2="274" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/>
    <g font-size="15" fill="#29485d" text-anchor="middle">
      <rect x="95" y="390" width="245" height="92" rx="5" fill="#f8fafb" stroke="#c6d2da"/><text x="217" y="420" font-weight="700">身份是否一致</text><text x="217" y="447">孔、面、槽是否是同一功能语义</text><text x="217" y="468" font-size="13">Identity and functional meaning</text>
      <rect x="385" y="390" width="245" height="92" rx="5" fill="#f8fafb" stroke="#c6d2da"/><text x="507" y="420" font-weight="700">自由度如何约束</text><text x="507" y="447">主、次、第三定位是否过约束</text><text x="507" y="468" font-size="13">Constraint sequence</text>
      <rect x="675" y="390" width="245" height="92" rx="5" fill="#f8fafb" stroke="#c6d2da"/><text x="797" y="420" font-weight="700">定位元件是否稳定</text><text x="797" y="447">销、块、夹具状态是否受控</text><text x="797" y="468" font-size="13">Locator condition</text>
      <rect x="965" y="390" width="145" height="92" rx="5" fill="#f8fafb" stroke="#c6d2da"/><text x="1037" y="420" font-weight="700">版本桥接</text><text x="1037" y="447">新旧规则可比</text><text x="1037" y="468" font-size="13">Revision bridge</text>
    </g>
    <rect x="90" y="554" width="1020" height="48" rx="5" fill="#edf1f3"/><text x="600" y="583" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#607483">只有可追溯的基准链才能解释孔位与装配差异 / A traceable datum chain gives hole and assembly deviations meaning</text>
  </g>
</svg>

