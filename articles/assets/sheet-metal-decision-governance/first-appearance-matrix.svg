      <g stroke="#c6d2da"><rect x="92" y="460" width="260" height="76" fill="#f8fafb"/><rect x="352" y="460" width="180" height="76" fill="#d8edf7"/><rect x="532" y="460" width="180" height="76" fill="#eadff1"/><rect x="712" y="460" width="180" height="76" fill="#edf1f3"/><rect x="892" y="460" width="216" height="76" fill="#eadff1"/></g><text x="222" y="505">方向改变</text><text x="442" y="505">模式A</text><text x="622" y="505">模式B</text><text x="802" y="505">待验证</text><text x="1000" y="505">状态与基准</text>
