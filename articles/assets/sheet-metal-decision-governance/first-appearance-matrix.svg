    <rect x="92" y="575" width="1016" height="38" rx="4" fill="#edf1f3"/><text x="600" y="599" text-anchor="middle" font-size="13" fill="#607483">矩阵用于排序调查，不把时间先后自动解释为因果 / Timing prioritizes investigation; it does not prove cause</text>
