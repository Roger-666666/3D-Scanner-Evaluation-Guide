<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/>
  <rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">异常首发矩阵：继承、放大还是本工序新生</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">First-appearance logic routes investigation without claiming automatic causality</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g fill="#d8edf7" stroke="#4c96b8"><rect x="92" y="170" width="260" height="62"/><rect x="352" y="170" width="180" height="62"/><rect x="532" y="170" width="180" height="62"/><rect x="712" y="170" width="180" height="62"/><rect x="892" y="170" width="216" height="62"/></g>
