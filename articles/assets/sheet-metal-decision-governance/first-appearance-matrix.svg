    <g font-size="15" text-anchor="middle" fill="#29485d">
      <g stroke="#c6d2da"><rect x="92" y="232" width="260" height="76" fill="#f8fafb"/><rect x="352" y="232" width="180" height="76" fill="#e4f0d6"/><rect x="532" y="232" width="180" height="76" fill="#e4f0d6"/><rect x="712" y="232" width="180" height="76" fill="#e4f0d6"/><rect x="892" y="232" width="216" height="76" fill="#e4f0d6"/></g><text x="222" y="277">持续存在</text><text x="442" y="277">出现</text><text x="622" y="277">保持</text><text x="802" y="277">保持</text><text x="1000" y="277">继承路径</text>
      <g stroke="#c6d2da"><rect x="92" y="308" width="260" height="76" fill="#f8fafb"/><rect x="352" y="308" width="180" height="76" fill="#edf1f3"/><rect x="532" y="308" width="180" height="76" fill="#f7e8b9"/><rect x="712" y="308" width="180" height="76" fill="#f7e8b9"/><rect x="892" y="308" width="216" height="76" fill="#f7e8b9"/></g><text x="222" y="353">首次稳定出现</text><text x="442" y="353">未见</text><text x="622" y="353">出现</text><text x="802" y="353">保持</text><text x="1000" y="353">本工序优先</text>
