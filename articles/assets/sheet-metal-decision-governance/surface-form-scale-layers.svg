<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/>
  <rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">大曲面分层评价：整体轮廓合格不等于局部面形稳定</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">Separate global form, local waviness, feature transitions and optical appearance evidence</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <path d="M90 250 C250 170, 400 310, 560 220 S870 160,1110 245" fill="none" stroke="#2f7fa6" stroke-width="8"/>
    <path d="M90 340 C160 310, 220 372, 290 338 S420 310,490 342 S620 372,690 334 S820 303,890 340 S1020 369,1110 330" fill="none" stroke="#79a653" stroke-width="6"/>
    <path d="M90 430 C120 400, 150 460, 180 430 S240 400,270 430 S330 460,360 430 S420 400,450 430 S510 460,540 430 S600 400,630 430 S690 460,720 430 S780 400,810 430 S870 460,900 430 S960 400,990 430 S1050 460,1080 430" fill="none" stroke="#c28a1b" stroke-width="4"/>
    <g fill="#17344a"><text x="100" y="185" font-size="20" font-weight="700">整体形状 / Global form</text><text x="100" y="305" font-size="20" font-weight="700">局部波纹 / Local waviness</text><text x="100" y="397" font-size="20" font-weight="700">细节与边界 / Detail &amp; boundary</text></g>
    <g font-size="14" fill="#607483"><text x="900" y="205">姿态、回弹、整体扭曲</text><text x="900" y="315">浅凹、鼓包、带状起伏</text><text x="900" y="405">压痕、圆角、特征转接</text></g>
    <rect x="90" y="500" width="490" height="78" rx="5" fill="#eadff1" stroke="#9270a8"/><text x="335" y="531" text-anchor="middle" font-size="17" font-weight="700" fill="#17344a">几何证据</text><text x="335" y="558" text-anchor="middle" font-size="14" fill="#36566b">色谱、截面族、曲率与区域连续性</text>
    <rect x="620" y="500" width="490" height="78" rx="5" fill="#f3d9d6" stroke="#c75b50"/><text x="865" y="531" text-anchor="middle" font-size="17" font-weight="700" fill="#17344a">外观证据</text><text x="865" y="558" text-anchor="middle" font-size="14" fill="#36566b">光照、涂装、观察条件与主观评价</text>
    <rect x="90" y="604" width="1020" height="27" rx="4" fill="#edf1f3"/><text x="600" y="623" text-anchor="middle" font-size="12" fill="#607483">曲线仅说明评价尺度，不表示真实表面数据 / Curves illustrate evaluation scales only</text>
  </g>
</svg>

