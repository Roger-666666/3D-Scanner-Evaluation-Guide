<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/>
  <rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">零件、检具与CAD：三角证据不能缺一边</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">A gauge result becomes interpretable only when part, fixture and CAD relationships are all controlled</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <line x1="600" y1="196" x2="310" y2="478" stroke="#5a7385" stroke-width="5"/>
    <line x1="600" y1="196" x2="890" y2="478" stroke="#5a7385" stroke-width="5"/>
    <line x1="310" y1="478" x2="890" y2="478" stroke="#5a7385" stroke-width="5"/>
    <circle cx="600" cy="190" r="92" fill="#d8edf7" stroke="#4c96b8" stroke-width="3"/>
    <text x="600" y="183" text-anchor="middle" font-size="23" font-weight="700" fill="#17344a">CAD与图纸</text><text x="600" y="211" text-anchor="middle" font-size="15" fill="#36566b">Design definition</text>
    <circle cx="300" cy="486" r="92" fill="#e4f0d6" stroke="#79a653" stroke-width="3"/>
    <text x="300" y="479" text-anchor="middle" font-size="23" font-weight="700" fill="#17344a">钣金零件</text><text x="300" y="507" text-anchor="middle" font-size="15" fill="#36566b">Measured part</text>
    <circle cx="900" cy="486" r="92" fill="#f7e8b9" stroke="#c28a1b" stroke-width="3"/>
    <text x="900" y="479" text-anchor="middle" font-size="23" font-weight="700" fill="#17344a">检具与定位件</text><text x="900" y="507" text-anchor="middle" font-size="15" fill="#36566b">Gauge &amp; locators</text>
    <rect x="366" y="280" width="230" height="56" rx="5" fill="#fff" stroke="#b9c8d3"/><text x="481" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#29485d">零件对CAD</text><text x="481" y="325" text-anchor="middle" font-size="13" fill="#607483">Part-to-CAD</text>
    <rect x="604" y="280" width="230" height="56" rx="5" fill="#fff" stroke="#b9c8d3"/><text x="719" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#29485d">检具对CAD</text><text x="719" y="325" text-anchor="middle" font-size="13" fill="#607483">Gauge-to-CAD</text>
    <rect x="485" y="448" width="230" height="56" rx="5" fill="#fff" stroke="#b9c8d3"/><text x="600" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#29485d">零件在检具中的响应</text><text x="600" y="493" text-anchor="middle" font-size="13" fill="#607483">Part-on-gauge response</text>
    <rect x="112" y="595" width="976" height="34" rx="4" fill="#edf1f3"/><text x="600" y="617" text-anchor="middle" font-size="13" fill="#607483">任一边缺失，都不能把检具报警直接归因于零件 / Missing one edge prevents direct attribution</text>
  </g>
</svg>

