<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f7"/>
  <rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b9c8d3" stroke-width="2"/>
  <text x="66" y="82" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#17344a">总成间隙面差贡献图：异常结果不等于单件责任</text>
  <text x="66" y="112" font-family="Arial,sans-serif" font-size="15" fill="#607483">Assembly deviation is a combined response of parts, locators, joining sequence and restraint</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a7385"/></marker></defs>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="70" y="185" width="210" height="90" rx="6" fill="#d8edf7" stroke="#4c96b8"/><text x="175" y="220" font-size="19" font-weight="700" fill="#17344a">零件A几何</text><text x="175" y="248" font-size="14" fill="#36566b">Part A geometry</text>
    <rect x="70" y="315" width="210" height="90" rx="6" fill="#e4f0d6" stroke="#79a653"/><text x="175" y="350" font-size="19" font-weight="700" fill="#17344a">零件B几何</text><text x="175" y="378" font-size="14" fill="#36566b">Part B geometry</text>
    <rect x="70" y="445" width="210" height="90" rx="6" fill="#f7e8b9" stroke="#c28a1b"/><text x="175" y="480" font-size="19" font-weight="700" fill="#17344a">定位与夹紧</text><text x="175" y="508" font-size="14" fill="#36566b">Locating &amp; restraint</text>
    <rect x="405" y="245" width="260" height="110" rx="6" fill="#eadff1" stroke="#9270a8"/><text x="535" y="286" font-size="20" font-weight="700" fill="#17344a">装配状态转移</text><text x="535" y="317" font-size="14" fill="#36566b">Assembly state transfer</text>
    <rect x="405" y="405" width="260" height="110" rx="6" fill="#f3d9d6" stroke="#c75b50"/><text x="535" y="446" font-size="20" font-weight="700" fill="#17344a">连接顺序与热影响</text><text x="535" y="477" font-size="14" fill="#36566b">Joining sequence &amp; thermal effect</text>
    <rect x="825" y="285" width="285" height="160" rx="6" fill="#dce9ee" stroke="#5a7385" stroke-width="2"/><text x="967" y="335" font-size="22" font-weight="700" fill="#17344a">总成响应</text><text x="967" y="367" font-size="17" fill="#29485d">间隙、面差、孔位、干涉</text><text x="967" y="398" font-size="14" fill="#607483">Gap, flushness, holes, interference</text>
    <line x1="280" y1="230" x2="399" y2="280" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="280" y1="360" x2="399" y2="320" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="280" y1="490" x2="399" y2="460" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="665" y1="300" x2="819" y2="345" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/><line x1="665" y1="460" x2="819" y2="405" stroke="#5a7385" stroke-width="4" marker-end="url(#a)"/>
    <rect x="96" y="574" width="1008" height="38" rx="4" fill="#edf1f3"/><text x="600" y="598" font-size="13" fill="#607483">贡献分析用于设计验证顺序，不自动分配责任比例 / The graph organizes evidence; it does not assign automatic percentages</text>
  </g>
</svg>

