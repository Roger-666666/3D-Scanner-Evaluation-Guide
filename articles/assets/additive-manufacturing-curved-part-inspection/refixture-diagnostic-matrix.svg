<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">重装夹诊断矩阵：异常跟着零件走，还是跟着姿态走</text><text x="65" y="112" font-size="15" fill="#607583">Repositioning separates part-fixed geometry from setup-sensitive measurement patterns</text>
  <g transform="translate(250 165)"><text x="210" y="0" text-anchor="middle" font-size="17" font-weight="700" fill="#15364b">重新装夹后，异常仍固定在零件坐标</text><text x="650" y="0" text-anchor="middle" font-size="17" font-weight="700" fill="#15364b">异常随测量姿态或视角变化</text><g stroke="#fff" stroke-width="5"><rect y="30" width="430" height="185" fill="#dff0e5"/><rect x="430" y="30" width="430" height="185" fill="#f7e8b9"/><rect y="215" width="430" height="185" fill="#efe7f4"/><rect x="430" y="215" width="430" height="185" fill="#f3d9d6"/></g><g text-anchor="middle" fill="#36596c"><text x="215" y="95" font-size="18" font-weight="700">优先调查零件</text><text x="215" y="130" font-size="14">成型、支撑释放、热处理</text><text x="215" y="158" font-size="14">局部后处理或真实缺损</text><text x="645" y="95" font-size="18" font-weight="700">优先调查测量链</text><text x="645" y="130" font-size="14">遮挡、反光、表面准备</text><text x="645" y="158" font-size="14">装夹、配准或边界提取</text><text x="215" y="280" font-size="18" font-weight="700">需要状态分层</text><text x="215" y="315" font-size="14">异常只在某一处理阶段出现</text><text x="215" y="343" font-size="14">比较状态是否一致</text><text x="645" y="280" font-size="18" font-weight="700">暂停工艺归因</text><text x="645" y="315" font-size="14">结果不重复或覆盖不足</text><text x="645" y="343" font-size="14">先恢复测量可信度</text></g></g>
  <g transform="translate(70 230)" font-size="15" fill="#15364b"><text y="45">复扫结果可重复</text><text y="235">复扫结果不稳定</text></g><text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">矩阵用于调查排序，不自动证明根因 / Diagnostic priority, not automatic causality</text></g>
</svg>
