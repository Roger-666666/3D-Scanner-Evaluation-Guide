<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">偏差色谱解释闸门：从“有颜色”到“可处置结论”</text><text x="65" y="112" font-size="15" fill="#607583">A color map becomes actionable only after data, alignment, geometry and function checks</text>
  <g transform="translate(65 190)" text-anchor="middle"><g stroke-width="3"><rect width="190" height="150" rx="8" fill="#d9edf3" stroke="#2f6f8f"/><rect x="225" width="190" height="150" rx="8" fill="#dff0e5" stroke="#4b8b69"/><rect x="450" width="190" height="150" rx="8" fill="#f7e8b9" stroke="#d08a2e"/><rect x="675" width="190" height="150" rx="8" fill="#efe7f4" stroke="#6f5a91"/><rect x="900" width="190" height="150" rx="8" fill="#f3d9d6" stroke="#b66058"/></g><g font-size="18" font-weight="700" fill="#15364b"><text x="95" y="45">数据闸门</text><text x="320" y="45">对齐闸门</text><text x="545" y="45">区域闸门</text><text x="770" y="45">功能闸门</text><text x="995" y="45">处置闸门</text></g><g font-size="14" fill="#36596c"><text x="95" y="82">覆盖与边界</text><text x="95" y="108">表面与处理</text><text x="320" y="82">功能基准</text><text x="320" y="108">对齐敏感性</text><text x="545" y="82">曲面/孔位</text><text x="545" y="108">支撑痕/边界</text><text x="770" y="82">装配与载荷</text><text x="770" y="108">允许理想化</text><text x="995" y="82">复扫与补证</text><text x="995" y="108">批准责任</text></g><g stroke="#2f6f8f" stroke-width="4"><path d="M190 75 H220 M415 75 H445 M640 75 H670 M865 75 H895"/></g></g>
  <g transform="translate(160 420)"><rect width="880" height="95" rx="8" fill="#f7f9fa" stroke="#94aab6" stroke-width="2"/><text x="440" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#15364b">任一闸门未通过：结果保持“待复核”，不直接归因于打印工艺</text><text x="440" y="68" text-anchor="middle" font-size="14" fill="#607583">Red does not automatically mean reject; green does not automatically mean functionally acceptable</text></g><text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">示意流程，具体判定依据批准规范 / Conceptual decision gates</text></g>
</svg>
