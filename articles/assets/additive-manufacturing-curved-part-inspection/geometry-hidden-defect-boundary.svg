<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">几何证据边界：扫描能看到什么，不能证明什么</text><text x="65" y="112" font-size="15" fill="#607583">Separate observable surface geometry from hidden structure and material properties</text>
  <g transform="translate(75 175)"><rect width="470" height="350" rx="8" fill="#edf6f9" stroke="#2f6f8f" stroke-width="3"/><text x="235" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#15364b">外表面几何证据</text><path d="M90 170 C150 65 255 75 310 145 C365 215 390 245 410 275" fill="none" stroke="#2f6f8f" stroke-width="18"/><circle cx="175" cy="115" r="13" fill="#d65b4d"/><circle cx="318" cy="158" r="13" fill="#d08a2e"/><g font-size="15" fill="#36596c"><text x="55" y="285">轮廓与自由曲面</text><text x="55" y="315">孔位、边界与局部塌陷</text><text x="55" y="345">支撑痕与后处理形貌</text></g></g>
  <g transform="translate(655 175)"><rect width="470" height="350" rx="8" fill="#faf1f0" stroke="#b66058" stroke-width="3"/><text x="235" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#7c3a35">需补充方法确认</text><path d="M90 170 C150 65 255 75 310 145 C365 215 390 245 410 275" fill="none" stroke="#c9bfc0" stroke-width="18"/><circle cx="210" cy="125" r="22" fill="#fff" stroke="#b66058" stroke-width="4" stroke-dasharray="6 5"/><circle cx="285" cy="160" r="15" fill="#fff" stroke="#b66058" stroke-width="4" stroke-dasharray="6 5"/><g font-size="15" fill="#6c4b48"><text x="55" y="285">内部孔隙与未熔合</text><text x="55" y="315">材料组织与残余应力</text><text x="55" y="345">强度、疲劳与服役寿命</text></g></g>
  <path d="M565 350 H635" stroke="#d08a2e" stroke-width="5"/><path d="M620 337 L640 350 620 363" fill="none" stroke="#d08a2e" stroke-width="5"/><text x="600" y="320" text-anchor="middle" font-size="14" fill="#8a5a22">异常定位后补证</text><text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">表面色谱不能替代内部与材料检测 / Surface maps do not prove internal integrity</text></g>
</svg>
