<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">状态合同：同一打印件在不同阶段不是同一个测量对象</text><text x="65" y="112" font-size="15" fill="#607583">Define build, support-removal, heat-treatment, finishing and free-state conditions before comparison</text>
  <g transform="translate(70 190)" text-anchor="middle"><g fill="#edf6f9" stroke="#2f6f8f" stroke-width="3"><rect width="180" height="120" rx="8"/><rect x="215" width="180" height="120" rx="8"/><rect x="430" width="180" height="120" rx="8"/><rect x="645" width="180" height="120" rx="8"/><rect x="860" width="180" height="120" rx="8"/></g><g font-size="17" font-weight="700" fill="#15364b"><text x="90" y="45">带支撑成型态</text><text x="305" y="45">去支撑态</text><text x="520" y="45">热处理态</text><text x="735" y="45">精整态</text><text x="950" y="45">自由验收态</text></g><g font-size="13" fill="#36596c"><text x="90" y="80">基板与支撑约束</text><text x="305" y="80">约束释放</text><text x="520" y="80">热历史改变</text><text x="735" y="80">切削/抛磨/喷砂</text><text x="950" y="80">批准环境与姿态</text></g><g stroke="#2f6f8f" stroke-width="4"><path d="M180 60 H210 M395 60 H425 M610 60 H640 M825 60 H855"/></g></g>
  <g transform="translate(130 390)"><rect width="940" height="130" rx="8" fill="#faf3dd" stroke="#d2a14f" stroke-width="3"/><text x="470" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#7b5521">每次比较必须绑定状态字段</text><g font-size="15" fill="#36596c"><text x="70" y="78">支撑与基板</text><text x="245" y="78">热处理与等待时间</text><text x="480" y="78">后处理与材料去除</text><text x="700" y="78">装夹与姿态</text><text x="70" y="108">表面准备</text><text x="245" y="108">温度与环境</text><text x="480" y="108">CAD版本与对齐</text><text x="700" y="108">检测目的与责任</text></g></g>
  <text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">状态未一致时，偏差不能直接归因于打印参数 / Conceptual state contract</text></g>
</svg>
