<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">几何缺陷闭环：从发现异常到再打印独立复验</text><text x="65" y="112" font-size="15" fill="#607583">A correction loop links scan evidence, cause review, controlled changes and independent reinspection</text>
  <g transform="translate(65 200)" text-anchor="middle"><g stroke-width="3"><rect width="175" height="120" rx="8" fill="#d9edf3" stroke="#2f6f8f"/><rect x="215" width="175" height="120" rx="8" fill="#f7e8b9" stroke="#d08a2e"/><rect x="430" width="175" height="120" rx="8" fill="#efe7f4" stroke="#6f5a91"/><rect x="645" width="175" height="120" rx="8" fill="#dff0e5" stroke="#4b8b69"/><rect x="860" width="175" height="120" rx="8" fill="#d9edf3" stroke="#2f6f8f"/></g><g font-size="17" font-weight="700" fill="#15364b"><text x="87" y="42">首件扫描</text><text x="302" y="42">异常分层</text><text x="517" y="42">受控修正</text><text x="732" y="42">再打印</text><text x="947" y="42">独立复验</text></g><g font-size="13" fill="#36596c"><text x="87" y="78">CAD比对与区域</text><text x="302" y="78">状态/测量/工艺</text><text x="517" y="78">一次一类变量</text><text x="732" y="78">冻结配方与批次</text><text x="947" y="78">复扫/装配/补证</text></g><g stroke="#2f6f8f" stroke-width="4"><path d="M175 60 H210 M390 60 H425 M605 60 H640 M820 60 H855"/></g></g>
  <path d="M1030 360 C1030 525 520 545 280 370" fill="none" stroke="#d08a2e" stroke-width="4" stroke-dasharray="11 8"/><path d="M295 365 L275 370 283 390" fill="none" stroke="#d08a2e" stroke-width="4"/><text x="650" y="505" text-anchor="middle" font-size="16" fill="#8a5a22">复验不通过：回到证据层重新判断，而不是继续叠加补偿</text><text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">闭环为治理示意，修正与放行依据项目规范 / Conceptual correction loop</text></g>
</svg>
