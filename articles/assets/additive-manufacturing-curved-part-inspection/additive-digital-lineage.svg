  <path d="M110 285 H1090" stroke="#94aab6" stroke-width="6"/><g text-anchor="middle"><g stroke-width="3"><circle cx="130" cy="285" r="42" fill="#d9edf3" stroke="#2f6f8f"/><circle cx="315" cy="285" r="42" fill="#efe7f4" stroke="#6f5a91"/><circle cx="500" cy="285" r="42" fill="#f7e8b9" stroke="#d08a2e"/><circle cx="685" cy="285" r="42" fill="#f7e8b9" stroke="#d08a2e"/><circle cx="870" cy="285" r="42" fill="#dff0e5" stroke="#4b8b69"/><circle cx="1055" cy="285" r="42" fill="#dff0e5" stroke="#4b8b69"/></g><g font-size="16" font-weight="700" fill="#15364b"><text x="130" y="205">设计CAD</text><text x="315" y="205">切片/配方</text><text x="500" y="205">构建批次</text><text x="685" y="205">后处理状态</text><text x="870" y="205">扫描与报告</text><text x="1055" y="205">处置与放行</text></g><g font-size="13" fill="#36596c"><text x="130" y="365">版本与关键区</text><text x="315" y="365">方向/支撑/路径</text><text x="500" y="365">设备/材料/时间</text><text x="685" y="365">去支撑/热处理</text><text x="870" y="365">数据/对齐/模板</text><text x="1055" y="365">复验/责任/用途</text></g></g>
