<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#b8c8d2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="65" y="82" font-size="30" font-weight="700" fill="#15364b">成型缺陷可观测性分层：几何异常不等于全部质量缺陷</text><text x="65" y="112" font-size="15" fill="#607583">Blue-light scanning observes accessible geometry; hidden and material defects need complementary evidence</text>
  <g transform="translate(100 165)" text-anchor="middle"><path d="M460 0 L850 390 H70 Z" fill="#edf6f9" stroke="#2f6f8f" stroke-width="4"/><path d="M265 195 H655 L850 390 H70 Z" fill="#dff0e5"/><path d="M362 98 H558 L655 195 H265 Z" fill="#f7e8b9"/><path d="M460 0 L558 98 H362 Z" fill="#f3d9d6"/>
  <text x="460" y="63" font-size="17" font-weight="700" fill="#7c3a35">不可由表面扫描单独确认</text><text x="460" y="91" font-size="14" fill="#6c4b48">内部孔隙、熔合状态、材料性能</text><text x="460" y="145" font-size="17" font-weight="700" fill="#7b5521">需要补证</text><text x="460" y="174" font-size="14" fill="#6f572f">薄壁内面、封闭腔体、深遮挡区</text><text x="460" y="250" font-size="18" font-weight="700" fill="#1e5540">可通过表面几何间接研判</text><text x="460" y="280" font-size="14" fill="#36596c">翘曲模式、边界收缩、局部塌陷线索</text><text x="460" y="345" font-size="18" font-weight="700" fill="#15364b">可直接形成外表面证据</text><text x="460" y="376" font-size="14" fill="#36596c">轮廓、孔位、自由曲面、支撑痕与外观缺口</text></g>
  <g transform="translate(900 205)" font-size="14" fill="#36596c"><text font-size="18" font-weight="700" fill="#15364b">结论规则</text><text y="45">先确认扫描是否看得见</text><text y="78">再确认数据是否可判定</text><text y="111">最后讨论可能的工艺原因</text><path d="M0 145 H210" stroke="#94aab6" stroke-width="2"/><text y="182">扫描定位异常区域</text><text y="215">不能单独证明内部机理</text></g>
  <text x="600" y="620" text-anchor="middle" font-size="13" fill="#607583">概念分层，不代表具体零件检测结论 / Conceptual observability model only</text></g>
</svg>
