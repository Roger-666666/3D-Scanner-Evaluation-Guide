<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f5"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#bccad2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="82" font-size="30" font-weight="700" fill="#17394d">局部复扫：异常跟着零件走，还是跟着视角走？</text><text x="64" y="112" font-size="15" fill="#607684">Part-fixed repetition supports geometry; view-fixed repetition suggests measurement sensitivity</text>
  <g transform="translate(80 165)"><rect width="500" height="390" rx="6" fill="#e6f2e9" stroke="#4b9366" stroke-width="3"/><text x="250" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#356b47">异常固定在零件坐标</text><path d="M70 220 Q250 60 430 220 Q250 360 70 220Z" fill="#86be93"/><circle cx="330" cy="170" r="34" fill="#d85b52" opacity=".9"/><path d="M85 315 H415" stroke="#6e8794" stroke-width="3" stroke-dasharray="9 7"/><text x="250" y="352" text-anchor="middle" font-size="16" fill="#526a78">换姿态后仍落在同一曲面区域</text>
  <rect x="540" width="500" height="390" rx="6" fill="#f6e7df" stroke="#d08b4b" stroke-width="3"/><text x="790" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#8b5d28">异常固定在视角 / 边缘</text><path d="M610 220 Q790 60 970 220 Q790 360 610 220Z" fill="#e6bd77"/><circle cx="930" cy="150" r="34" fill="#d85b52" opacity=".9"/><path d="M625 315 H955" stroke="#6e8794" stroke-width="3" stroke-dasharray="9 7"/><text x="790" y="352" text-anchor="middle" font-size="16" fill="#526a78">换姿态后异常迁移或消失</text></g>
  <text x="64" y="620" font-size="16" fill="#526a78">结论仍需结合表面状态、拼接残差、网格处理和功能影响；复现不是根因证明。</text></g>
</svg>
