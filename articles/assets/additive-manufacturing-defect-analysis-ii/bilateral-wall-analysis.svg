<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#bccad2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="82" font-size="30" font-weight="700" fill="#17394d">薄壁打印件双侧曲面关联</text><text x="64" y="112" font-size="15" fill="#607684">Pair accessible outer and inner surfaces before interpreting wall behavior</text>
  <g transform="translate(90 165)"><path d="M60 290 C170 70 390 70 505 290" fill="none" stroke="#34799e" stroke-width="28"/><path d="M100 304 C205 125 365 125 465 304" fill="none" stroke="#58a876" stroke-width="28"/><g stroke="#17394d" stroke-width="3"><line x1="168" y1="170" x2="195" y2="211"/><line x1="282" y1="112" x2="282" y2="157"/><line x1="397" y1="170" x2="369" y2="211"/></g><text x="282" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#254e63">可访问双侧：可评估表面间距趋势</text>
  <path d="M575 290 C680 70 900 70 1015 290" fill="none" stroke="#34799e" stroke-width="28"/><path d="M615 304 C720 125 880 125 975 304" fill="none" stroke="#b7c4cb" stroke-width="28" stroke-dasharray="12 12"/><rect x="735" y="148" width="150" height="140" fill="#f4e3e0" opacity=".85"/><text x="795" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#8f403a">内侧遮挡：不能宣称真实壁厚</text>
  <g font-size="16"><circle cx="160" cy="455" r="9" fill="#34799e"/><text x="180" y="461" fill="#526a78">外表面网格</text><circle cx="350" cy="455" r="9" fill="#58a876"/><text x="370" y="461" fill="#526a78">内表面网格</text><circle cx="555" cy="455" r="9" fill="#b7c4cb"/><text x="575" y="461" fill="#526a78">未观测 / 推测区域</text></g></g>
  <text x="64" y="620" font-size="16" fill="#526a78">光学扫描只计算已重建表面之间的几何关系，不直接证明内部孔隙、熔合或材料强度。</text></g>
</svg>
