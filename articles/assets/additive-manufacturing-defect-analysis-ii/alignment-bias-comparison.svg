<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#edf3f6"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#bccad2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="82" font-size="30" font-weight="700" fill="#16384c">同一打印件，不同对齐得到不同“故事”</text><text x="64" y="112" font-size="15" fill="#607684">Registration redistributes deviation; it does not change the physical part</text>
  <g transform="translate(62 160)"><g><rect width="330" height="390" rx="6" fill="#f5f8fa" stroke="#b9c9d2"/><text x="165" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#245875">全局最佳拟合</text><path d="M42 210 Q165 90 288 210 Q165 330 42 210Z" fill="#69a8c8" opacity=".85"/><path d="M48 215 Q165 124 282 215" fill="none" stroke="#d85750" stroke-width="20" opacity=".85"/><text x="165" y="352" text-anchor="middle" font-size="15" fill="#526b79">整体误差变小，但接口漂移可能被摊薄</text></g>
  <g transform="translate(370 0)"><rect width="330" height="390" rx="6" fill="#f5f8fa" stroke="#b9c9d2"/><text x="165" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#356b47">基准约束对齐</text><path d="M42 210 Q165 90 288 210 Q165 330 42 210Z" fill="#66ae78" opacity=".85"/><circle cx="78" cy="210" r="17" fill="#fff" stroke="#17394d" stroke-width="4"/><circle cx="252" cy="210" r="17" fill="#fff" stroke="#17394d" stroke-width="4"/><path d="M160 115 Q210 190 270 220" fill="none" stroke="#d85750" stroke-width="18"/><text x="165" y="352" text-anchor="middle" font-size="15" fill="#526b79">保留装配坐标，暴露功能区域偏差</text></g>
  <g transform="translate(740 0)"><rect width="330" height="390" rx="6" fill="#f5f8fa" stroke="#b9c9d2"/><text x="165" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#8b6423">局部区域对齐</text><path d="M42 210 Q165 90 288 210 Q165 330 42 210Z" fill="#e4b75d" opacity=".8"/><rect x="112" y="135" width="106" height="150" fill="none" stroke="#17394d" stroke-width="4" stroke-dasharray="10 8"/><text x="165" y="352" text-anchor="middle" font-size="15" fill="#526b79">适合观察局部形貌，不用于全局放行</text></g></g>
  <text x="64" y="616" font-size="16" fill="#526a78">报告必须保存对齐目的、基准、排除区域与版本，否则颜色无法复核。</text></g>
</svg>
