<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f5"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#bccad2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="82" font-size="30" font-weight="700" fill="#17394d">3D打印件对齐方式选择树</text><text x="64" y="112" font-size="15" fill="#607684">Choose registration by inspection question, not by the prettiest color map</text>
  <g transform="translate(70 158)" text-anchor="middle"><rect x="380" width="300" height="64" rx="6" fill="#17394d"/><text x="530" y="40" font-size="21" font-weight="700" fill="#fff">本次要回答什么问题？</text>
  <path d="M530 64 V115 M180 115 H880 M180 115 V150 M530 115 V150 M880 115 V150" fill="none" stroke="#8aa1ae" stroke-width="4"/>
  <g><rect x="50" y="150" width="260" height="82" rx="6" fill="#dfeef5" stroke="#34799e" stroke-width="3"/><text x="180" y="184" font-size="19" font-weight="700" fill="#245875">整体形貌趋势</text><text x="180" y="211" font-size="15" fill="#526a78">先看全局变形</text><rect x="50" y="288" width="260" height="82" rx="6" fill="#eaf3f7"/><text x="180" y="325" font-size="19" font-weight="700" fill="#245875">全局拟合 + 基准复核</text><text x="180" y="350" font-size="14" fill="#526a78">不得单独作为功能放行</text></g>
  <g><rect x="400" y="150" width="260" height="82" rx="6" fill="#e5f1e7" stroke="#4b9366" stroke-width="3"/><text x="530" y="184" font-size="19" font-weight="700" fill="#356b47">装配与接口</text><text x="530" y="211" font-size="15" fill="#526a78">保持使用坐标</text><rect x="400" y="288" width="260" height="82" rx="6" fill="#edf5ee"/><text x="530" y="325" font-size="19" font-weight="700" fill="#356b47">基准 / RPS约束</text><text x="530" y="350" font-size="14" fill="#526a78">输出孔位、边界和间隙</text></g>
  <g><rect x="750" y="150" width="260" height="82" rx="6" fill="#fff0ce" stroke="#d39831" stroke-width="3"/><text x="880" y="184" font-size="19" font-weight="700" fill="#895f1f">局部成型形貌</text><text x="880" y="211" font-size="15" fill="#526a78">隔离整体姿态</text><rect x="750" y="288" width="260" height="82" rx="6" fill="#fff6df"/><text x="880" y="325" font-size="19" font-weight="700" fill="#895f1f">局部对齐 / 截面</text><text x="880" y="350" font-size="14" fill="#526a78">限定区域，不外推全局</text></g>
  <rect x="310" y="430" width="440" height="68" rx="6" fill="#f4e3e0" stroke="#c85c53" stroke-width="3"/><text x="530" y="458" font-size="18" font-weight="700" fill="#913f39">结果不一致时保留全部视图</text><text x="530" y="483" font-size="15" fill="#526a78">差异本身就是诊断信息</text></g></g>
</svg>
