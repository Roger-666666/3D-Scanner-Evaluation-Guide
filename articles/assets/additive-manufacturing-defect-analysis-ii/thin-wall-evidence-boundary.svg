<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#eef3f5"/><rect x="28" y="28" width="1144" height="624" rx="8" fill="#fff" stroke="#bccad2" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="64" y="82" font-size="30" font-weight="700" fill="#17394d">薄壁证据边界：能回答什么，不能回答什么</text><text x="64" y="112" font-size="15" fill="#607684">Separate accessible surface geometry from internal and material claims</text>
  <g transform="translate(70 165)"><rect width="500" height="385" rx="6" fill="#e6f2e9" stroke="#4b9366" stroke-width="3"/><text x="250" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#356b47">蓝光扫描可直接支持</text><g font-size="18" fill="#315565"><text x="45" y="105">✓ 外侧与可见内侧的曲面形貌</text><text x="45" y="155">✓ 两张已重建表面之间的距离趋势</text><text x="45" y="205">✓ 边界、孔槽、翘曲和局部塌陷</text><text x="45" y="255">✓ 不同工艺状态的表面变化</text><text x="45" y="305">✓ 可追溯的网格与几何报告</text></g>
  <rect x="560" width="500" height="385" rx="6" fill="#f6e5e2" stroke="#c85c53" stroke-width="3"/><text x="810" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#913f39">需要其他证据确认</text><g font-size="18" fill="#6f4a47"><text x="605" y="105">• 封闭内部的真实壁厚与空腔</text><text x="605" y="155">• 内部孔隙、未熔合或夹杂</text><text x="605" y="205">• 残余应力、组织与材料性能</text><text x="605" y="255">• 疲劳寿命和结构安全结论</text><text x="605" y="305">• 唯一工艺根因的证明</text></g>
  <path d="M500 190 H560" stroke="#17394d" stroke-width="5"/><polygon points="548,180 568,190 548,200" fill="#17394d"/><text x="530" y="350" text-anchor="middle" font-size="15" fill="#526a78">按风险选择补充方法</text></g></g>
</svg>
