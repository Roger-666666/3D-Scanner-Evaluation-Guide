<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Automotive camshaft functional datum chain</title>
  <desc id="desc">A device-free engineering diagram showing the shaft datum axis, journals, cam-lobe profiles, relative phase, flange, keyway, and end interface.</desc>
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b6975"/>
      <stop offset=".5" stop-color="#52bea7"/>
      <stop offset="1" stop-color="#d6c45f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dceef1"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#071821"/>
  <g opacity=".12" stroke="#86bec7">
    <path d="M0 90H1280M0 180H1280M0 270H1280M0 360H1280M0 450H1280M0 540H1280M0 630H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>
  <text x="64" y="70" fill="#f2fbfc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Camshaft Functional Datum Chain</text>
  <text x="64" y="106" fill="#98bcc4" font-family="Arial, sans-serif" font-size="18">Profiles, phase, journals, and end features share one controlled axis and angular zero</text>

  <g filter="url(#shadow)">
    <rect x="160" y="338" width="930" height="48" rx="24" fill="url(#shaft)" stroke="#afe9df" stroke-width="3"/>
    <rect x="206" y="308" width="86" height="108" rx="28" fill="#1b5360" stroke="#65d2c0" stroke-width="3"/>
    <rect x="900" y="302" width="98" height="120" rx="28" fill="#b0aa55" stroke="#f1da78" stroke-width="3"/>
    <path d="M342 316C366 264 428 264 448 322L454 362L448 402C428 460 366 460 342 408L330 362Z" fill="#2e9c8f" stroke="#85e2ce" stroke-width="3"/>
    <path d="M488 322C512 270 574 270 594 328L600 362L594 396C574 454 512 454 488 402L476 362Z" fill="#42b39c" stroke="#91ead4" stroke-width="3"/>
    <path d="M634 312C658 260 720 260 740 318L746 362L740 406C720 464 658 464 634 412L622 362Z" fill="#71bd86" stroke="#b7e99a" stroke-width="3"/>
    <path d="M780 324C804 272 866 272 886 330L892 362L886 394C866 452 804 452 780 400L768 362Z" fill="#a7b55f" stroke="#e0d77b" stroke-width="3"/>
    <circle cx="1060" cy="362" r="74" fill="#d2bd59" stroke="#f2d878" stroke-width="4"/>
    <circle cx="1060" cy="362" r="24" fill="#071821" stroke="#f2d878" stroke-width="3"/>
    <rect x="1108" y="346" width="96" height="32" rx="10" fill="#446f78" stroke="#8bd4dc" stroke-width="3"/>
    <rect x="1148" y="340" width="20" height="16" rx="3" fill="#f09068"/>
  </g>

  <path d="M128 362H1210" stroke="#f3ca60" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="82" y="354" fill="#f3d779" font-family="Arial, sans-serif" font-size="16" font-weight="700">DATUM AXIS</text>

  <g stroke="#dceef1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M248 198L248 302"/>
    <path d="M404 188L404 270"/>
    <path d="M552 174L552 270"/>
    <path d="M694 186L694 260"/>
    <path d="M836 174L836 272"/>
    <path d="M1036 176L1050 284"/>
    <path d="M1158 506L1158 384"/>
    <path d="M900 538L938 426"/>
    <path d="M484 532L508 418"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#f4fbfc" font-size="18" font-weight="700">
    <text x="192" y="178">Journal datum</text>
    <text x="344" y="168">Lobe profile A</text>
    <text x="492" y="154">Relative phase</text>
    <text x="640" y="166">Lobe profile B</text>
    <text x="786" y="154">Journal relation</text>
    <text x="1000" y="156">Flange / trigger</text>
    <text x="994" y="534">Keyway / end interface</text>
    <text x="842" y="566">Runout relationship</text>
    <text x="420" y="560">Profile sections</text>
  </g>
  <rect x="64" y="628" width="1152" height="50" rx="7" fill="#0d2731" stroke="#355b65"/>
  <text x="94" y="660" fill="#b9d6db" font-family="Arial, sans-serif" font-size="16">Interpretation: local features are evaluated in a shared datum system; unrestricted best fit can hide functional relationships.</text>
</svg>
