<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Camshaft manufacturing and assembly evidence loop</title>
  <desc id="desc">A quality loop connecting component identity, manufacturing state, measured geometry, assembly interfaces, functional verification, and controlled feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151e"/>
      <stop offset="1" stop-color="#17343f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#77d9dc"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="66" y="70" fill="#f3fbfc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Camshaft Manufacturing and Assembly Evidence Loop</text>
  <text x="66" y="106" fill="#99bec5" font-family="Arial, sans-serif" font-size="18">Geometry links process and assembly, while material and engine function require independent evidence</text>

  <g font-family="Arial, sans-serif">
    <g fill="none" stroke="#77d9dc" stroke-width="3" marker-end="url(#arrow)">
      <path d="M298 266H392"/>
      <path d="M598 266H692"/>
      <path d="M898 266H992"/>
      <path d="M1096 330V426"/>
      <path d="M992 490H898"/>
      <path d="M692 490H598"/>
      <path d="M392 490H298"/>
      <path d="M194 426V330"/>
    </g>
    <g>
      <rect x="92" y="202" width="206" height="128" rx="8" fill="#0d2a34" stroke="#2cc6d6" stroke-width="2"/>
      <text x="120" y="244" fill="#edfafd" font-size="21" font-weight="700">Identity + CAD</text>
      <text x="120" y="278" fill="#add0d6" font-size="16">part family, revision, datums</text>
      <text x="120" y="304" fill="#71e0e8" font-size="14" font-weight="700">DESIGN EVIDENCE</text>
    </g>
    <g>
      <rect x="392" y="202" width="206" height="128" rx="8" fill="#0d2a34" stroke="#63d4ad" stroke-width="2"/>
      <text x="420" y="244" fill="#edfafd" font-size="21" font-weight="700">Process State</text>
      <text x="420" y="278" fill="#add0d6" font-size="16">heat treat, grind, finish</text>
      <text x="420" y="304" fill="#84e8ba" font-size="14" font-weight="700">PROCESS EVIDENCE</text>
    </g>
    <g>
      <rect x="692" y="202" width="206" height="128" rx="8" fill="#0d2a34" stroke="#f1c75e" stroke-width="2"/>
      <text x="720" y="244" fill="#edfafd" font-size="21" font-weight="700">Measured Geometry</text>
      <text x="720" y="278" fill="#add0d6" font-size="16">profile, axis, phase, interface</text>
      <text x="720" y="304" fill="#f5d57c" font-size="14" font-weight="700">3D EVIDENCE</text>
    </g>
    <g>
      <rect x="992" y="202" width="206" height="128" rx="8" fill="#0d2a34" stroke="#e6926d" stroke-width="2"/>
      <text x="1020" y="244" fill="#edfafd" font-size="21" font-weight="700">Assembly Interface</text>
      <text x="1020" y="278" fill="#add0d6" font-size="16">gear, flange, key, bearing</text>
      <text x="1020" y="304" fill="#f0aa89" font-size="14" font-weight="700">FIT EVIDENCE</text>
    </g>
    <g>
      <rect x="992" y="426" width="206" height="128" rx="8" fill="#0d2a34" stroke="#b79ae5" stroke-width="2"/>
      <text x="1020" y="468" fill="#edfafd" font-size="21" font-weight="700">Functional Review</text>
      <text x="1020" y="502" fill="#add0d6" font-size="16">timing, durability, noise</text>
      <text x="1020" y="528" fill="#ceb8ef" font-size="14" font-weight="700">FUNCTION EVIDENCE</text>
    </g>
    <g>
      <rect x="692" y="426" width="206" height="128" rx="8" fill="#0d2a34" stroke="#68bddb" stroke-width="2"/>
      <text x="720" y="468" fill="#edfafd" font-size="21" font-weight="700">Batch Comparison</text>
      <text x="720" y="502" fill="#add0d6" font-size="16">supplier, line, time, revision</text>
      <text x="720" y="528" fill="#82cee6" font-size="14" font-weight="700">QUALITY MEMORY</text>
    </g>
    <g>
      <rect x="392" y="426" width="206" height="128" rx="8" fill="#0d2a34" stroke="#5bb99d" stroke-width="2"/>
      <text x="420" y="468" fill="#edfafd" font-size="21" font-weight="700">Controlled Trial</text>
      <text x="420" y="502" fill="#add0d6" font-size="16">one traceable change</text>
      <text x="420" y="528" fill="#7dd6b4" font-size="14" font-weight="700">TESTABLE HYPOTHESIS</text>
    </g>
    <g>
      <rect x="92" y="426" width="206" height="128" rx="8" fill="#0d2a34" stroke="#d6a45d" stroke-width="2"/>
      <text x="120" y="468" fill="#edfafd" font-size="21" font-weight="700">Approved Feedback</text>
      <text x="120" y="502" fill="#add0d6" font-size="16">design, tool, process, recipe</text>
      <text x="120" y="528" fill="#e4bb78" font-size="14" font-weight="700">CLOSED LOOP</text>
    </g>
  </g>

  <rect x="66" y="620" width="1148" height="62" rx="8" fill="#0d2731" stroke="#355d67"/>
  <text x="96" y="646" fill="#f1f8fa" font-family="Arial, sans-serif" font-size="17" font-weight="700">Boundary:</text>
  <text x="96" y="670" fill="#accbd1" font-family="Arial, sans-serif" font-size="16">surface geometry does not directly measure hardness, internal defects, lubrication behavior, or engine performance.</text>
</svg>
